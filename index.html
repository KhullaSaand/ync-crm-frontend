<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>YNC CRM</title>
<style>
:root{
  --brand:#8B0000;
  --brand-dark:#5a0000;
  --brand-light:#b30000;
  --brand-bg:#fff5f5;
  --brand-border:#f5cccc;
  --black:#111;
  --gray:#64748b;
  --gray2:#94a3b8;
  --gray3:#e2e8f0;
  --gray4:#f8fafc;
  --white:#fff;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --orange:#ea580c;
  --orange-bg:#fff7ed;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --yellow:#ca8a04;
  --yellow-bg:#fefce8;
  --purple:#7c3aed;
  --purple-bg:#f3e8ff;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:var(--black);min-height:100vh}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none}
a{text-decoration:none;color:inherit}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#5a0000 0%,#8B0000 50%,#b30000 100%)}
.auth-card{background:var(--white);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .logo-ync{font-size:42px;font-weight:900;color:var(--brand);letter-spacing:-2px;line-height:1}
.auth-logo .logo-sub{font-size:11px;letter-spacing:4px;color:var(--gray);text-transform:uppercase;margin-top:4px}
.auth-logo .logo-tagline{font-size:13px;color:var(--gray);margin-top:8px}
.auth-tabs{display:flex;border-bottom:2px solid var(--gray3);margin-bottom:24px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.auth-tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1.5px solid var(--gray3);border-radius:var(--radius);font-size:14px;transition:border .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--brand)}
.btn-primary{width:100%;padding:12px;background:var(--brand);color:var(--white);border-radius:var(--radius);font-size:15px;font-weight:700;transition:background .2s;margin-top:4px}
.btn-primary:hover{background:var(--brand-dark)}
.auth-error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.auth-error.show{display:block}

/* LAYOUT */
#app{display:none;height:100vh;overflow:hidden;flex-direction:row}
#app.show{display:flex}
#sidebar{width:240px;min-width:240px;background:var(--brand-dark);display:flex;flex-direction:column;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--white);border-bottom:1px solid var(--gray3);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px}

/* SIDEBAR */
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo .s-ync{font-size:28px;font-weight:900;color:#fff;letter-spacing:-1px}
.sidebar-logo .s-crm{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.6);text-transform:uppercase;margin-top:2px}
.sidebar-logo .s-tag{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}
.sidebar-nav{padding:12px 8px;flex:1}
.nav-section{margin-bottom:6px}
.nav-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.75);font-size:13.5px;font-weight:500;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item .ni{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--brand-light);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.su-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.su-name{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.su-role{font-size:11px;color:rgba(255,255,255,.5)}
.su-logout{margin-left:auto;background:none;color:rgba(255,255,255,.5);font-size:18px;padding:4px;border-radius:6px;transition:color .2s}
.su-logout:hover{color:#fff}

/* TOPBAR */
.topbar-title{font-size:18px;font-weight:700;color:var(--black)}
.topbar-right{display:flex;align-items:center;gap:12px}
.btn-add{background:var(--brand);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-add:hover{background:var(--brand-dark)}
.search-box{position:relative}
.search-box input{padding:8px 12px 8px 34px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;width:220px;transition:border .2s}
.search-box input:focus{border-color:var(--brand)}
.search-box .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray2);font-size:15px}

/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--brand)}
.stat-card.green{border-left-color:var(--green)}
.stat-card.blue{border-left-color:var(--blue)}
.stat-card.orange{border-left-color:var(--orange)}
.stat-card.purple{border-left-color:var(--purple)}
.stat-label{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:28px;font-weight:500;color:var(--black);margin-top:6px;line-height:1}
.stat-sub{font-size:12px;color:var(--gray2);margin-top:4px}

/* TABLE */
.table-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
.table-header{padding:16px 20px;border-bottom:1px solid var(--gray3);display:flex;align-items:center;justify-content:space-between}
.table-title{font-size:15px;font-weight:700}
.table-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-select{padding:6px 10px;border:1.5px solid var(--gray3);border-radius:7px;font-size:13px;color:var(--black);background:var(--white)}
.filter-select:focus{border-color:var(--brand);outline:none}
table{width:100%;border-collapse:collapse}
thead th{background:var(--gray4);padding:10px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray3)}
tbody tr{border-bottom:1px solid var(--gray3);transition:background .1s;cursor:pointer}
tbody tr:hover{background:var(--brand-bg)}
tbody tr:last-child{border-bottom:none}
td{padding:12px 16px;font-size:13.5px;vertical-align:middle}
.avatar-cell{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-bg);border:1.5px solid var(--brand-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0}
.av.sm{width:26px;height:26px;font-size:10px}
.cell-name{font-weight:600;color:var(--black)}
.cell-sub{font-size:12px;color:var(--gray2);margin-top:1px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge-prospect{background:#f1f5f9;color:#475569}
.badge-qualified{background:var(--blue-bg);color:var(--blue)}
.badge-hot_lead{background:#fff7ed;color:#c2410c}
.badge-negotiation{background:var(--yellow-bg);color:var(--yellow)}
.badge-won{background:var(--green-bg);color:var(--green)}
.badge-lost{background:#fee2e2;color:#dc2626}
.badge-cold{background:#f1f5f9;color:#94a3b8}
/* lead statuses (unified) */
.badge-new_inquiry{background:var(--blue-bg);color:var(--blue)}
.badge-quoted{background:var(--yellow-bg);color:var(--yellow)}
.badge-follow_up{background:#fff7ed;color:#c2410c}
.badge-shipment_booked{background:var(--green-bg);color:var(--green)}
.badge-delivered{background:#052e16;color:#86efac}
.badge-cancelled{background:#fee2e2;color:#dc2626}
/* task */
.badge-pending{background:var(--yellow-bg);color:var(--yellow)}
.badge-in_progress{background:var(--blue-bg);color:var(--blue)}
.badge-completed{background:var(--green-bg);color:var(--green)}
.badge-overdue{background:#fee2e2;color:#dc2626}
/* priority */
.badge-high{background:#fee2e2;color:#dc2626}
.badge-medium{background:var(--yellow-bg);color:var(--yellow)}
.badge-low{background:var(--green-bg);color:var(--green)}
/* shipment mode */
.badge-air{background:var(--blue-bg);color:var(--blue)}
.badge-sea{background:var(--purple-bg);color:var(--purple)}
.badge-road{background:var(--green-bg);color:var(--green)}
.badge-courier{background:#fff7ed;color:#c2410c}
/* category badges */
.badge-logistics{background:var(--blue-bg);color:var(--blue)}
.badge-ecommerce{background:var(--purple-bg);color:var(--purple)}
.badge-customs{background:var(--orange-bg);color:var(--orange)}
.badge-moving{background:var(--green-bg);color:var(--green)}
.badge-warehousing{background:var(--yellow-bg);color:var(--yellow)}
/* sub-nav category filters */
.cat-filters{padding:2px 0 6px 0}
.cat-filter{display:block;padding:5px 12px 5px 42px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border-radius:6px;transition:all .15s;margin-bottom:1px}
.cat-filter:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.cat-filter.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:960px}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--gray3);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:17px;font-weight:700}
.modal-close{background:none;font-size:22px;color:var(--gray);padding:4px;border-radius:6px;line-height:1}
.modal-close:hover{color:var(--black)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--gray3);display:flex;justify-content:flex-end;gap:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--gray);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13.5px;transition:border .2s;color:var(--black);background:var(--white)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand)}
.fg textarea{resize:vertical;min-height:70px}
.btn-cancel{padding:9px 20px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;color:var(--gray);background:var(--white)}
.btn-cancel:hover{background:var(--gray4)}
.btn-save{padding:9px 24px;background:var(--brand);color:#fff;border-radius:8px;font-size:13px;font-weight:700}
.btn-save:hover{background:var(--brand-dark)}
.btn-danger{padding:9px 20px;background:#dc2626;color:#fff;border-radius:8px;font-size:13px;font-weight:700}
.btn-get-rates{padding:8px 16px;background:#fef3c7;color:#92400e;border:1.5px solid #fcd34d;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-get-rates:hover{background:#fde68a}
.btn-book{padding:8px 16px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-book:hover{background:var(--brand-dark)}
.btn-label{padding:8px 16px;background:#ede9fe;color:#6d28d9;border:1.5px solid #c4b5fd;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-label:hover{background:#ddd6fe}
.btn-edit{padding:8px 16px;background:var(--white);color:var(--gray);border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-edit:hover{background:var(--gray4)}
.btn-delete{padding:8px 16px;background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-delete:hover{background:#fee2e2}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.detail-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--gray2)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--gray);margin-bottom:6px}
.empty-sub{font-size:13px}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--gray3);font-size:13px;color:var(--gray)}
.page-btns{display:flex;gap:6px}
.page-btn{padding:6px 12px;border:1.5px solid var(--gray3);border-radius:7px;font-size:13px;background:var(--white);color:var(--gray);font-weight:600}
.page-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.page-btn:disabled{opacity:.4;cursor:default}
.page-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* DETAIL PANEL */
.detail-panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
.dp-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.dp-name{font-size:20px;font-weight:800}
.dp-company{font-size:14px;color:var(--gray);margin-top:3px}
.dp-actions{display:flex;gap:8px}
.btn-edit{padding:7px 16px;background:var(--brand-bg);color:var(--brand);border:1.5px solid var(--brand-border);border-radius:8px;font-size:13px;font-weight:600}
.btn-edit:hover{background:var(--brand);color:#fff}
.btn-back{padding:7px 14px;background:var(--gray4);border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;color:var(--gray);display:flex;align-items:center;gap:6px}
.btn-back:hover{background:var(--gray3)}
.dp-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dp-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray2);margin-bottom:3px;display:block}
.dp-field span{font-size:14px;color:var(--black);font-weight:500}
.section-title{font-size:14px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--gray3)}

/* DASHBOARD QUICK */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.quick-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.quick-card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray3)}
.activity-item:last-child{border:none}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:5px}
.act-title{font-size:13px;font-weight:500}
.act-time{font-size:11px;color:var(--gray2)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slideIn .3s ease}
.toast-item.success::before{content:'✅'}
.toast-item.error::before{content:'❌'}
.toast-item.info::before{content:'ℹ️'}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ROLE BADGE */
.role-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.role-admin{background:#fee2e2;color:#991b1b}
.role-manager{background:var(--blue-bg);color:#1d4ed8}
.role-sales_rep{background:var(--green-bg);color:#15803d}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--gray2);font-size:14px}
.spinner{width:28px;height:28px;border:3px solid var(--gray3);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TABS */
.tab-strip{display:flex;gap:4px;background:var(--gray4);padding:4px;border-radius:10px;margin-bottom:20px;width:fit-content}
.tab-btn{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--gray);background:none;transition:all .15s}
.tab-btn.active{background:var(--white);color:var(--brand);box-shadow:var(--shadow)}

/* TRACKING TIMELINE */
.tracking-tl{position:relative;padding-left:28px;margin:0 0 20px 0}
.tracking-tl::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--gray3)}
.tracking-tl-item{position:relative;padding:10px 0 10px 0;cursor:default}
.tracking-tl-item::before{content:'';position:absolute;left:-22px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--gray3);border:2px solid var(--white);z-index:1}
.tracking-tl-item:last-child::before{background:var(--brand)}
.tracking-tl-item .tl-status{font-size:14px;font-weight:600;color:var(--black)}
.tracking-tl-item .tl-loc{font-size:12px;color:var(--gray);margin-top:2px}
.tracking-tl-item .tl-date{font-size:11px;color:var(--gray2);margin-top:2px}
.tracking-tl-item .tl-del{position:absolute;right:0;top:10px;background:none;color:var(--gray2);font-size:16px;padding:2px 6px;border-radius:4px}
.tracking-tl-item .tl-del:hover{color:#dc2626;background:#fee2e2}
.btn-tracking{padding:7px 16px;background:#059669;color:#fff;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-tracking:hover{background:#047857}
.btn-view{padding:6px 14px;background:var(--brand-bg);color:var(--brand);border:1.5px solid var(--brand-border);border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:filter .15s}
.btn-view:hover{filter:brightness(.96)}
.btn-view.locked{background:var(--gray4);color:var(--gray2);border-color:var(--gray3);cursor:not-allowed}
th.actions-col,td.actions-col{text-align:right;white-space:nowrap}
.notes-block{margin-top:18px;border-top:1.5px dashed var(--gray3);padding-top:14px}
.notes-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.notes-head .notes-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray2);margin:0}
.btn-note-add{padding:5px 12px;background:var(--brand-bg);color:var(--brand);border:1.5px solid var(--brand-border);border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-note-add:hover{filter:brightness(.96)}
.note-item{position:relative;background:var(--gray4);border:1.5px solid var(--gray3);border-radius:10px;padding:10px 36px 10px 12px;margin-bottom:8px}
.note-meta{font-size:11.5px;color:var(--gray2);margin-bottom:4px;font-weight:600}
.note-text{font-size:13.5px;color:var(--gray);white-space:pre-wrap;line-height:1.5;word-break:break-word}

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const API = 'https://ync-crm-backend.vercel.app';

// ─── STATE ─────────────────────────────────────────────────────────────────
let token    = localStorage.getItem('ync_token') || '';
let me       = JSON.parse(localStorage.getItem('ync_me') || 'null');
let curPage  = 'dashboard';
let curData  = {};
let modalCb  = null;
let searchTimer = null;
let curSearch = '';
let curFilter = {};
let curPageNum = 1;
let curCategoryFilter = '';

// ─── API CACHE ──────────────────────────────────────────────────────────────
const _apiCache = new Map();
const CACHE_TTL = 60000; // 60s auto-refresh

function cacheKey(method, path) { return `${method}:${path}`; }

function invalidateCache(pathPrefix) {
  for (const k of _apiCache.keys()) {
    if (k.split(':')[1]?.startsWith(pathPrefix)) _apiCache.delete(k);
  }
}

// ─── API HELPER ────────────────────────────────────────────────────────────
async function api(method, path, body) {
  if (method === 'GET' && !body) {
    const ck = cacheKey(method, path);
    const cached = _apiCache.get(ck);
    if (cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
    if (cached) _apiCache.delete(ck); // expired
  }
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const j = await r.json();
  if (!j.success && r.status === 401) { doLogout(); return null; }
  if (method === 'GET' && j.success) _apiCache.set(cacheKey(method, path), { data: j, ts: Date.now() });
  if (method !== 'GET' && j.success) { invalidateCache(path.split('?')[0].replace(/\/[^/]*$/, '')); }
  return j;
}

let _refreshTimer = null;
let _viewingDetail = false;
function startAutoRefresh() {
  if (_refreshTimer) clearInterval(_refreshTimer);
  _refreshTimer = setInterval(() => {
    if (!token || !curPage || _viewingDetail) return;
    const modalOpen = document.getElementById('modal-overlay')?.classList.contains('show');
    if (modalOpen) return;
    // don't yank the page away while the user is picking an inline status
    if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('row-status')) return;
    const pageMap = {
      'dashboard':     ['/api/reports?type=summary', '/api/reports?type=activity&range=month'],
      'contacts':      ['/api/contacts?page=1&limit=15'],
      'quote-leads':   ['/api/quote-leads?page=1&limit=15'],
      'shipment-leads':['/api/shipment-leads?page=1&limit=15'],
      'book-shipment': ['/api/shipment-leads?page=1&limit=15&source=booking'],
      'tasks':         ['/api/tasks?page=1&limit=15'],
      'invoices':      ['/api/invoices?page=1&limit=15'],
    };
    const urls = pageMap[curPage];
    if (urls) {
      urls.forEach(u => _apiCache.delete(cacheKey('GET', u)));
      renderPage(curPage);
    }
  }, 15000);
}

function preloadAll() {
  const pages = [
    '/api/reports?type=summary',
    '/api/reports?type=activity&range=month',
    '/api/contacts?page=1&limit=15',
    '/api/quote-leads?page=1&limit=15',
    '/api/shipment-leads?page=1&limit=15',
    '/api/shipment-leads?page=1&limit=15&source=booking',
    '/api/tasks?page=1&limit=15',
  ];
  if (me.role === 'admin' || me.role === 'manager') pages.push('/api/users');
  pages.forEach(p => api('GET', p));
}

// ─── AUTH ──────────────────────────────────────────────────────────────────
function switchAuthTab(t) {
  document.querySelectorAll('.auth-tab').forEach((el,i) => el.classList.toggle('active', (t==='login'&&i===0)||(t==='register'&&i===1)));
  document.getElementById('tab-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('tab-register').style.display = t==='register' ? '' : 'none';
  clearAuthErr();
}
function showAuthErr(msg) { const e = document.getElementById('auth-error'); e.textContent = msg; e.classList.add('show'); }
function clearAuthErr()   { const e = document.getElementById('auth-error'); e.classList.remove('show'); }

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  if (!email || !pass) { showAuthErr('Email and password are required'); return; }
  clearAuthErr();
  const r = await fetch(API + '/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pass })
  }).then(x => x.json()).catch(() => null);
  if (!r || !r.success) { showAuthErr(r?.error || 'Login failed'); return; }
  token = r.data.token; me = r.data.user;
  localStorage.setItem('ync_token', token);
  localStorage.setItem('ync_me', JSON.stringify(me));
  initApp();
}

async function doRegister() {
  const name    = document.getElementById('reg-name').value.trim();
  const email   = document.getElementById('reg-email').value.trim();
  const pass    = document.getElementById('reg-password').value;
  const company = document.getElementById('reg-company').value.trim();
  if (!name || !email || !pass) { showAuthErr('Name, email and password are required'); return; }
  clearAuthErr();
  const r = await fetch(API + '/api/auth/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, password: pass, company })
  }).then(x => x.json()).catch(() => null);
  if (!r || !r.success) { showAuthErr(r?.error || 'Registration failed'); return; }
  token = r.data.token; me = r.data.user;
  localStorage.setItem('ync_token', token);
  localStorage.setItem('ync_me', JSON.stringify(me));
  initApp();
}

async function doLogout() {
  if (token) await fetch(API + '/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }).catch(() => {});
  token = ''; me = null;
  _apiCache.clear();
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
  localStorage.removeItem('ync_token'); localStorage.removeItem('ync_me');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('show');
}

// ─── INIT ──────────────────────────────────────────────────────────────────
function initApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('su-avatar').textContent = me.avatar || me.name?.slice(0,2).toUpperCase() || '??';
  document.getElementById('su-name').textContent   = me.name;
  document.getElementById('su-role').textContent   = roleLabel(me.role);
  if (me.role === 'admin' || me.role === 'manager') {
    document.getElementById('nav-section-admin').style.display = '';
  }
  nav(localStorage.getItem('ync_page') || 'dashboard');
  preloadAll();
  startAutoRefresh();
}

window.onload = () => {
  // Check invite token in URL
  const params = new URLSearchParams(location.search);
  const invite = params.get('invite');
  if (invite) {
    switchAuthTab('register');
    document.getElementById('auth-screen').style.display = 'flex';
    window._inviteToken = invite;
    return;
  }
  if (token && me) { initApp(); }
  else { document.getElementById('auth-screen').style.display = 'flex'; }
};

// ─── NAVIGATION ───────────────────────────────────────────────────────────
const PAGE_TITLES = {
  dashboard: 'Dashboard', contacts: 'Contacts',
  'quote-leads': 'Leads', 'shipment-leads': 'Shipment',
  tasks: 'Tasks', users: 'Team Management', reports: 'Reports',
  'get-rate': 'Get Rate', invoices: 'Invoices'
};
const ADD_LABELS = {
  contacts: '+ Contact', 'quote-leads': '+ Quote Lead',
  'shipment-leads': '+ Shipment Lead', tasks: '+ Task', users: '+ Team Member',
  invoices: '+ Invoice'
};

function nav(page) {
  curPage = page; curSearch = ''; curPageNum = 1; curFilter = {};
  _viewingDetail = false;
  localStorage.setItem('ync_page', page);
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const ni = document.getElementById('nav-' + page);
  if (ni) ni.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  const addBtn = document.getElementById('btn-add');
  const srchWrap = document.getElementById('search-wrap');
  if (ADD_LABELS[page]) { addBtn.style.display = ''; addBtn.textContent = ADD_LABELS[page]; }
  else addBtn.style.display = 'none';
  const searchPages = ['contacts','quote-leads','shipment-leads','tasks','users','invoices'];
  srchWrap.style.display = searchPages.includes(page) ? '' : 'none';
  document.getElementById('search-input').value = '';
  const catFilters = document.getElementById('cat-filters');
  if (catFilters) catFilters.style.display = page === 'quote-leads' ? '' : 'none';
  if (page !== 'quote-leads') { curCategoryFilter = ''; }
  renderPage(page);
}

function onSearch(v) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { curSearch = v; curPageNum = 1; renderPage(curPage); }, 350);
}

// ─── RENDER ROUTER ────────────────────────────────────────────────────────
function renderPage(page) {
  switch(page) {
    case 'dashboard':     renderDashboard(); break;
    case 'contacts':      renderContacts(); break;
    case 'quote-leads':   renderQuoteLeads(); break;
    case 'shipment-leads':renderShipmentLeads(); break;
    case 'book-shipment':renderBookShipment(); break;
    case 'tasks':         renderTasks(); break;
    case 'invoices':      renderInvoices(); break;
    case 'users':         renderUsers(); break;
    case 'reports':       renderReports(); break;
    case 'get-rate':      renderGetRate(); break;
  }
}

function sgCountryOptions(sel) {
  const opts = SG_COUNTRIES.split(',').map(p => { const i = p.indexOf(':'); const c = p.slice(0, i), n = p.slice(i + 1); return `<option value="${c}" ${c === sel ? 'selected' : ''}>${n} (${c})</option>`; }).join('');
  return `<option value="" ${!sel ? 'selected' : ''}>Select country…</option>` + opts;
}
function guessCountry(s) {
  if (!s) return '';
  const t = String(s).toLowerCase();
  const alias = { 'uk': 'GB', 'united kingdom': 'GB', 'england': 'GB', 'britain': 'GB', 'usa': 'US', 'united states': 'US', 'america': 'US', 'uae': 'AE', 'emirates': 'AE', 'dubai': 'AE', 'holland': 'NL', 'south korea': 'KR', 'korea': 'KR', 'russia': 'RU', 'turkiye': 'TR', 'czech': 'CZ', 'ivory coast': 'CI' };
  for (const k in alias) { if (t.includes(k)) return alias[k]; }
  if (/^[a-z]{2}$/.test(t)) return t.toUpperCase();
  const entry = SG_COUNTRIES.split(',').find(p => { const n = p.slice(p.indexOf(':') + 1).toLowerCase(); return t.includes(n); });
  return entry ? entry.slice(0, 2) : '';
}
function extractIntlPostcode(s) {
  if (!s) return '';
  const t = String(s);
  const uk = t.match(/\b([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})\b/i);
  if (uk) return uk[1].toUpperCase().replace(/\s+/, ' ');
  const parts = t.split(',').map(p => p.trim()).filter(Boolean);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.length < 3 || p.length > 12 || !/^[A-Za-z0-9][A-Za-z0-9 -]*$/.test(p)) continue;
    const digits = (p.match(/\d/g) || []).length;
    const letters = (p.match(/[A-Za-z]/g) || []).length;
    if (letters > 0 && digits > 0 && p === p.toUpperCase()) return p;
    if (letters === 0 && /^\d{4,8}$/.test(p.replace(/ /g, ''))) return p;
  }
  return '';
}

async function fetchGetRate() {
  const gr = document.getElementById('gr-result'); if (gr) gr.innerHTML = '';
  const country = (document.getElementById('gr-country') || {}).value || 'IN';
  if (country === 'IN') return fetchDelhiveryGetRate();

}
async function fetchDelhiveryGetRate() {
  const origin = document.getElementById('gr-origin').value.trim();
  const dest = document.getElementById('gr-dest').value.trim();
  const weight = parseFloat(document.getElementById('gr-weight').value);
  const value = parseFloat(document.getElementById('gr-value').value);

  if (!origin || !/^\d{6}$/.test(origin)) { toast('Enter valid 6-digit origin pincode', 'error'); return; }
  if (!dest || !/^\d{6}$/.test(dest)) { toast('Enter valid 6-digit destination pincode', 'error'); return; }
  if (!weight || weight <= 0) { toast('Enter valid weight', 'error'); return; }
  if (!value || value <= 0) { toast('Enter declared value', 'error'); return; }

  const lens = document.querySelectorAll('.gr-len');
  const wids = document.querySelectorAll('.gr-wid');
  const hgts = document.querySelectorAll('.gr-hgt');
  const qtys = document.querySelectorAll('.gr-qty');

  const dimensions = [];
  for (let i = 0; i < lens.length; i++) {
    const l = parseFloat(lens[i].value);
    const w = parseFloat(wids[i].value);
    const h = parseFloat(hgts[i].value);
    const q = parseInt(qtys[i].value) || 1;
    if (l && w && h) {
      dimensions.push({ length_cm: l, width_cm: w, height_cm: h, box_count: q });
    }
  }

  // Default to 1x1x1 if no dimensions (Delhivery allows this)
  if (dimensions.length === 0) {
    dimensions.push({ length_cm: 1, width_cm: 1, height_cm: 1, box_count: 1 });
  }

  const btn = document.getElementById('gr-fetch-btn');
  btn.disabled = true; btn.textContent = 'Fetching...';

  const result = await api('POST', '/api/delhivery/rate', {
    source_pin: origin,
    consignee_pin: dest,
    weight_g: Math.round(weight * 1000),
    inv_amount: value,
    dimensions: dimensions,
    payment_mode: 'prepaid',
  });

  btn.disabled = false; btn.textContent = 'Get Rate';

  if (!result) { toast('Session expired. Please log in again.', 'error'); return; }
  if (!result.success) { toast(result.error || 'Failed to get rate', 'error'); return; }

  const d = result.data;

  // Clean breakup: skip internal/zero fields, use friendly labels
  const SKIP = ['pre_tax_freight_charges','gst_percent','meta_charges','markup','green','lm','appointment_charges','other_handling_charges'];
  const LABELS = { base_freight_charge:'Base Freight', fuel_surcharge:'Fuel Surcharge', fuel_hike:'Fuel Hike', insurance_rov:'Insurance / ROV', oda:'ODA Charges', fm:'FM Charges', gst:'GST (18%)' };
  const breakup = d.priceBreakup ? Object.entries(d.priceBreakup)
    .filter(([k,v]) => !SKIP.includes(k) && v != null && !isNaN(Number(v)) && Number(v) > 0)
    .map(([k,v]) => ({ label: LABELS[k] || k.replace(/_/g,' '), amount: Number(v) })) : [];

  // Calculate vol weight per box (skip if default 1x1x1)
  let volRows = '';
  let totalVolWt = 0;
  const isDefaultDim = dimensions.length === 1 && dimensions[0].length_cm === 1 && dimensions[0].width_cm === 1 && dimensions[0].height_cm === 1;
  if (!isDefaultDim) {
    dimensions.forEach((dim, i) => {
      const divisor = 4500;
      const volWt = (dim.length_cm * dim.width_cm * dim.height_cm) / divisor;
      totalVolWt += volWt;
      volRows += `<tr><td style="padding:5px 14px;font-size:12px;color:var(--gray);border-bottom:1px solid var(--gray3)">${i+1}. ${dim.length_cm}×${dim.width_cm}×${dim.height_cm}cm</td><td style="padding:5px 14px;font-size:12px;text-align:center;border-bottom:1px solid var(--gray3)">${dim.box_count}</td><td style="padding:5px 14px;font-size:12px;text-align:right;border-bottom:1px solid var(--gray3)">${volWt.toFixed(2)} kg</td></tr>`;
    });
  }

  document.getElementById('gr-result').innerHTML = `
  <div style="background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden">
    <!-- Header -->
    <div style="padding:16px 20px;border-bottom:1px solid var(--gray3);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:15px;font-weight:700;color:var(--black)">🚚 YNCDL</div>
        <div style="font-size:11px;color:var(--gray);margin-top:2px">${origin} → ${dest}</div>
      </div>
      <div style="display:flex;gap:20px;font-size:12px">
        <span style="color:var(--gray)">Chargeable<br><strong style="color:var(--black);font-size:15px">${d.chargedWeight || '—'} kg</strong></span>
      </div>
    </div>
    ${me?.role === 'admin' ? `
    <!-- Admin: full breakup with prices -->
    <div style="padding:14px 20px">
      <div style="background:var(--gray4);border-radius:10px;padding:14px 16px">
        ${breakup.map(item => `
        <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--gray3)">
          <span style="color:var(--gray)">${item.label}</span>
          <span style="color:var(--black);font-weight:500">₹${item.amount.toLocaleString()}</span>
        </div>`).join('')}
        <div style="display:flex;justify-content:space-between;padding:8px 0 4px;font-size:14px;font-weight:700;border-top:2px solid var(--gray3);margin-top:4px">
          <span>Total</span>
          <span>₹${d.delhiveryRate.toLocaleString()}</span>
        </div>
      </div>
    </div>
    ` : `
    <!-- Manager/Sales Rep: names only, no prices, in dropdown -->
    <div style="padding:12px 20px">
      <details style="background:var(--gray4);border-radius:10px;overflow:hidden">
        <summary style="padding:10px 16px;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px">
          <span style="font-size:10px">▼</span> Price Break Down
        </summary>
        <div style="padding:0 16px 12px">
          ${breakup.map(item => `
          <div style="padding:4px 0;font-size:12px;color:var(--gray);border-bottom:1px solid var(--gray3)">${item.label}</div>`).join('')}
        </div>
      </details>
    </div>
    `}
    <!-- YNC Final Rate -->
    <div style="padding:0 20px 16px">
      <div style="background:var(--brand-bg);border:2px solid var(--brand-border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand)">YNC Rate</div>
          <div style="font-size:10px;color:var(--gray);margin-top:2px">Inclusive of all charges</div>
        </div>
        <div style="font-size:24px;font-weight:800;color:var(--brand-dark)">₹${d.finalRate.toLocaleString()}</div>
      </div>
    </div>
    <!-- Weights -->
    <div style="padding:10px 20px;border-top:1px solid var(--gray3);display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--gray2)">
      <span>Physical: <strong style="color:var(--black)">${weight} kg</strong></span>
      <span>Chargeable: <strong style="color:var(--black)">${d.chargedWeight || '—'} kg</strong></span>
      <span>Volumetric: <strong style="color:var(--black)">${totalVolWt.toFixed(2)} kg</strong></span>
    </div>
    ${volRows ? `
    <div style="padding:0 20px 14px">
      <div style="background:var(--gray4);border-radius:8px;padding:6px 0">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="border-bottom:1px solid var(--gray3)">
            <th style="padding:5px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);text-align:left">Dimensions</th>
            <th style="padding:5px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);text-align:center">Qty</th>
            <th style="padding:5px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);text-align:right">Vol. Wt</th>
          </tr></thead>
          <tbody>${volRows}</tbody>
          <tfoot><tr style="font-weight:700;border-top:1px solid var(--gray3)">
            <td colspan="2" style="padding:5px 14px;font-size:11px;text-align:right">Total</td>
            <td style="padding:5px 14px;font-size:11px;text-align:right">${totalVolWt.toFixed(2)} kg</td>
          </tr></tfoot>
        </table>
      </div>
    </div>` : ''}
  </div>`;
}

}

      <div class="fg" style="flex:1;margin:0"><label>Length</label><input id="mf-len" type="number" step="0.1" placeholder="L" value="${dl}" oninput="calcDimWeightQ()"/></div>
      <div style="font-size:20px;font-weight:700;color:var(--gray2);margin-top:18px">×</div>
      <div class="fg" style="flex:1;margin:0"><label>Width</label><input id="mf-wid" type="number" step="0.1" placeholder="W" value="${dw}" oninput="calcDimWeightQ()"/></div>
      <div style="font-size:20px;font-weight:700;color:var(--gray2);margin-top:18px">×</div>
      <div class="fg" style="flex:1;margin:0"><label>Height</label><input id="mf-hgt" type="number" step="0.1" placeholder="H" value="${dh}" oninput="calcDimWeightQ()"/></div>
    </div>
    <div class="form-row">
      <div class="fg" style="margin:0"><label>Actual Weight (kg)</label><input id="mf-weight" type="number" step="0.01" value="${l?.weight||''}"/></div>
      <div class="fg" style="margin:0"><label>Dim. Weight (kg)</label><input id="mf-dimweight" type="number" step="0.01" placeholder="Auto" readonly style="background:#f1f5f9;color:var(--gray);cursor:not-allowed"/></div>
    </div>
  </div>`;
}
function calcDimWeightQ() {
  const L = parseFloat(document.getElementById('mf-len')?.value) || 0;
  const W = parseFloat(document.getElementById('mf-wid')?.value) || 0;
  const H = parseFloat(document.getElementById('mf-hgt')?.value) || 0;
  const dw = document.getElementById('mf-dimweight');
  if (!dw) return;
  if (L > 0 && W > 0 && H > 0) {
    dw.value = ((L * W * H) / 5000).toFixed(2);
    dw.style.background = '#fefce8';
  } else { dw.value = ''; dw.style.background = '#f1f5f9'; }
}

function showModal(title, bodyHtml, saveCb) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-foot').innerHTML = '<button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" id="modal-save" onclick="modalSave()">Save</button>';
  document.getElementById('modal-overlay').classList.add('show');
  modalCb = saveCb;
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); modalCb = null; }
let _modalSaving = false;
function modalSave() {
  // Prevent double-submit: ignore extra clicks while a save is in flight
  if (_modalSaving || !modalCb) return;
  _modalSaving = true;
  const btn = document.getElementById('modal-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  const done = () => { _modalSaving = false; if (btn) { btn.disabled = false; btn.textContent = 'Save'; } };
  try { Promise.resolve(modalCb()).then(done, done); } catch (e) { done(); }
}

// ─── DIMENSIONAL WEIGHT ───────────────────────────────────────────────────────
// Formula: (L × W × H) / 5000  — standard international courier divisor
function calcDimWeight(type) {
  const L = parseFloat(document.getElementById('mf-len')?.value) || 0;
  const W = parseFloat(document.getElementById('mf-wid')?.value) || 0;
  const H = parseFloat(document.getElementById('mf-hgt')?.value) || 0;
  const dw = document.getElementById('mf-dimweight');
  if (!dw) return;
  if (L > 0 && W > 0 && H > 0) {
    dw.value = ((L * W * H) / 5000).toFixed(2);
    dw.style.background = '#fefce8';
  } else {
    dw.value = '';
    dw.style.background = '#f1f5f9';
  }
}

let _invLeadType = null;

function invMoney(n) { if (n == null || isNaN(Number(n))) return '₹0.00'; return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtINVDate(d) { if (!d) return '—'; const dt = new Date(d); if (isNaN(dt.getTime())) return '—'; const p = x => String(x).padStart(2, '0'); return `${p(dt.getDate())}/${p(dt.getMonth() + 1)}/${dt.getFullYear()}`; }
function payBadge(s) { const m = { paid: 'Paid', partial: 'Partial', due: 'Due' }; return `<span class="badge badge-${s}">${m[s] || esc(s)}</span>`; }
function invBalance(inv) { return Math.max(0, Math.round(((Number(inv.total) || 0) - (Number(inv.amountPaid) || 0)) * 100) / 100); }
function invWords(num) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = n => n < 20 ? ones[n] : (tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : ''));
  const three = n => n >= 100 ? (ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + two(n % 100) : '')) : two(n);
  const inr = n => {
    n = Math.floor(n);
    if (n === 0) return 'Zero';
    let s = '';
    const cr = Math.floor(n / 10000000); n %= 10000000;
    const lk = Math.floor(n / 100000); n %= 100000;
    const th = Math.floor(n / 1000); n %= 1000;
    if (cr) s += three(cr) + ' Crore ';
    if (lk) s += two(lk) + ' Lakh ';
    if (th) s += two(th) + ' Thousand ';
    if (n) s += three(n);
    return s.trim();
  };
  const rupees = Math.floor(num || 0);
  const paise = Math.round(((num || 0) - rupees) * 100);
  let out = 'Indian Rupee ' + inr(rupees);
  if (paise) out += ' and ' + inr(paise) + ' Paise';
  return out + ' Only';
}

function invLinesRender() {
  const el = document.getElementById('inv-lines');
  if (!el) return;
  el.innerHTML = _invLines.length ? _invLines.map((l, i) => `
    <div class="inv-line">
      <input class="inv-inp" placeholder="e.g. Shipping Charges" value="${esc(l.description)}" oninput="invLineField(${i},'description',this.value)"/>
      <input class="inv-inp" placeholder="Sub-description (optional)" value="${esc(l.details || '')}" oninput="invLineField(${i},'details',this.value)"/>
      <input class="inv-inp" type="number" min="0" step="any" value="${l.qty ?? 1}" oninput="invLineField(${i},'qty',this.value)"/>
      <input class="inv-inp" type="number" min="0" step="any" placeholder="0.00" value="${l.rate ?? ''}" oninput="invLineField(${i},'rate',this.value)"/>
      <button type="button" class="inv-line-del" onclick="invLineRemove(${i})" title="Remove line">✕</button>
    </div>`).join('') : `<div style="font-size:12.5px;color:var(--gray2);padding:4px 0">No lines yet — click "+ Add Line".</div>`;
}
function invLineField(i, k, v) { if (!_invLines[i]) return; _invLines[i][k] = v; invCalcTotals(); }
function invLineAdd() { _invLines.push({ description: '', details: '', qty: 1, rate: '' }); invLinesRender(); invCalcTotals(); }
function invLineRemove(i) { _invLines.splice(i, 1); invLinesRender(); invCalcTotals(); }
function invCalcTotals() {
  const el = document.getElementById('inv-totals');
  if (!el) return;
  const sub = _invLines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.rate) || 0), 0);
  const c = Number(document.getElementById('inv-cgst')?.value) || 0;
  const g = Number(document.getElementById('inv-sgst')?.value) || 0;
  const ca = sub * c / 100, sa = sub * g / 100, tot = sub + ca + sa;
  const paid = Number(document.getElementById('inv-paid')?.value) || 0;
  const bal = Math.max(0, tot - paid);
  el.innerHTML = `
    <span>Sub Total: <b>${invMoney(sub)}</b></span>
    <span>CGST (${c}%): <b>${invMoney(ca)}</b></span>
    <span>SGST (${g}%): <b>${invMoney(sa)}</b></span>
    <span>Balance: <b style="color:${bal > 0 ? '#dc2626' : '#059669'}">${invMoney(bal)}</b></span>
    <span style="margin-left:auto">Total: <b style="font-size:14px;color:var(--brand)">${invMoney(tot)}</b></span>`;
}
function invTermsChange(v) {
  const days = { 'Due on Receipt': 0, 'Net 7': 7, 'Net 15': 15, 'Net 30': 30 }[v] ?? 0;
  const dEl = document.getElementById('inv-date'), dueEl = document.getElementById('inv-duedate');
  if (!dEl || !dueEl) return;
  const base = dEl.value ? new Date(dEl.value + 'T00:00:00') : new Date();
  base.setDate(base.getDate() + days);
  const p = x => String(x).padStart(2, '0');
  dueEl.value = `${base.getFullYear()}-${p(base.getMonth() + 1)}-${p(base.getDate())}`;
}
async function invLookupLead() {
  const val = document.getElementById('inv-lookup').value.trim();
  const el = document.getElementById('inv-lookup-result');
  if (!val) { el.innerHTML = '<span style="color:var(--red)">Please enter a Lead ID</span>'; return; }
  el.innerHTML = '<span style="color:var(--gray)">Looking up...</span>';
  let data = null, type = null;
  for (const t of ['shipment-leads', 'quote-leads', 'contacts']) {
    const r = await api('GET', `/api/${t}?search=${encodeURIComponent(val)}&limit=5`);
    const items = Array.isArray(r?.data) ? r.data : [];
    if (items.length) { data = items[0]; type = t; break; }
  }
  if (!data) { el.innerHTML = '<span style="color:var(--red)">Lead not found</span>'; return; }
  if (rowLocked(data)) {
    el.innerHTML = `<span style="color:#dc2626">🔒 Assigned to <strong>${esc(data.assignedTo?.name || 'another user')}</strong> — you do not have access to this record</span>`;
    return;
  }
  _invLeadType = type === 'shipment-leads' ? 'shipment' : type === 'quote-leads' ? 'quote' : 'contact';
  document.getElementById('inv-lead').textContent = data.leadId || '';
  const setVal = (id, v) => { const e = document.getElementById(id); if (e && v != null) e.value = v || ''; };
  setVal('inv-customer', data.customerName || data.name);
  setVal('inv-sphone', data.phone);
  const addr = [data.address1, data.address2, data.address3].filter(Boolean).join(', ');
  if (addr) setVal('inv-address', addr);
  const route = [data.origin, data.destination].filter(Boolean).join(' → ');
  if (type === 'shipment-leads') {
    setVal('inv-rname', data.receiverName);
    setVal('inv-rphone', data.receiverPhone);
    const daddr = [data.destAddress1, data.destAddress2, data.destAddress3].filter(Boolean).join(', ');
    if (daddr) setVal('inv-raddr', daddr);
    setVal('inv-waybill', data.awbNumber || data.bookingRef);
    if (data.freightCharge) {
      _invLines = [{ description: 'Shipping Charges', details: (route || 'Shipment freight') + ' shipment freight charges', qty: 1, rate: data.freightCharge }];
      invLinesRender();
    }
  } else if (type === 'quote-leads') {
    if (data.quotedAmount) {
      _invLines = [{ description: 'Shipping Charges', details: (route || 'Shipment freight') + ' quoted freight charges', qty: 1, rate: data.quotedAmount }];
      invLinesRender();
    }
  }
  invCalcTotals();
  el.innerHTML = `<span style="color:#059669;font-weight:700">✓ Linked ${esc(data.leadId)}${data.customerName ? ' — ' + esc(data.customerName) : ''}</span>`;
}

async function downloadInvoicePdf(btn) {
  const el = document.querySelector('.invoice-page');
  if (!el) return;
  if (typeof html2pdf === 'undefined') {
    toast('PDF library has not loaded yet — check your connection and try again', 'error');
    return;
  }
  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Generating…'; }
  const prevW = el.style.width;
  el.style.width = '760px';
  try {
    const inv = window._invEditData || {};
    const filename = String(inv.invoiceNo || 'invoice').replace(/[\\/:*?"<>|]/g, '-') + '.pdf';
    await html2pdf().set({
      margin: [6, 8],
      filename,
      image: { type: 'jpeg', quality: 1 },
      html2canvas: { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] },
    }).from(el).save();
  } catch (e) {
    console.error('[PDF]', e);
    toast('Could not generate PDF', 'error');
  }
  el.style.width = prevW;
  if (btn) { btn.disabled = false; btn.innerHTML = orig; }
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDT(d) { if (!d) return ''; const dt = new Date(d); if (isNaN(dt.getTime())) return ''; return dt.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

// ─── ROW LOCK (sales rep sees other reps' records only as locked search hits) ─
function rowLocked(r) { return !!(me && me.role === 'sales_rep' && (!r || !r.assignedTo || r.assignedTo.id !== me.id)); }
function lockedAccess(btn) { toast('🔒 Assigned to ' + (btn && btn.dataset ? btn.dataset.name : 'another user') + ' — you do not have access to this record.', 'error'); }

async function rowStatusChange(type, id, val, sel) {

// ─── MULTIPLE NOTES ────────────────────────────────────────────────────────
const NOTE_API = { contact: '/api/contacts', quote: '/api/quote-leads', shipment: '/api/shipment-leads' };
function parseNotes(raw) {
  if (!raw) return [];
  const t = String(raw).trim(); if (!t) return [];
  if (t.startsWith('[')) {
    try {
      const arr = JSON.parse(t);
      if (Array.isArray(arr)) {
        if (arr.length === 0) return [];
        const items = arr.filter(n => n && typeof n.text === 'string' && n.text.trim())
          .map(n => ({ id: (typeof n.id === 'string' && n.id) ? n.id : 'n' + Math.random().toString(36).slice(2,10), text: String(n.text), by: (typeof n.by === 'string' && n.by) ? n.by : null, at: (typeof n.at === 'string' && n.at) ? n.at : null }));
        if (items.length) return items;
      }
    } catch (e) {}
  }
  return [{ id: 'legacy', text: t, by: null, at: null }];
}
function notesHtml(type, id, raw, ctx) {
  ctx = ctx || 'd';
  const notes = parseNotes(raw);
  return `<div class="notes-block" id="notes-${type}-${id}-${ctx}">
    <div class="notes-head"><div class="notes-label">📝 Notes (${notes.length})</div>
      <button type="button" class="btn-note-add" onclick="noteEditorToggle('${type}','${id}','${ctx}')">+ Add Note</button></div>
    <div class="notes-list">${notes.length ? notes.map(n => `
      <div class="note-item"><div class="note-meta">${esc(n.by || '—')}${n.at ? ' · ' + fmtDT(n.at) : ''}</div>
        <div class="note-text">${esc(n.text)}</div>
        <button type="button" class="note-del" title="Delete note" onclick="deleteNote('${type}','${id}','${n.id}','${ctx}')">✕</button></div>`).join('')
      : `<div style="font-size:12.5px;color:var(--gray2);padding:2px 0">No notes yet — click "+ Add Note" to write one.</div>`}</div>
    <div class="note-editor" id="note-ed-${type}-${id}-${ctx}" style="display:none">
      <textarea id="note-ta-${type}-${id}-${ctx}" placeholder="Write a note..."></textarea>
      <div class="note-editor-actions">
        <button type="button" class="btn-cancel" onclick="noteEditorHide('${type}','${id}','${ctx}')">Cancel</button>
        <button type="button" class="btn-save" onclick="saveNote('${type}','${id}','${ctx}')">Save Note</button>
      </div>
    </div>
  </div>`;
}
function noteEditorToggle(type, id, ctx) {
  const ed = document.getElementById(`note-ed-${type}-${id}-${ctx}`); if (!ed) return;
  const show = ed.style.display === 'none';
  ed.style.display = show ? '' : 'none';
  if (show) { const ta = document.getElementById(`note-ta-${type}-${id}-${ctx}`); if (ta) ta.focus(); }
}
function noteEditorHide(type, id, ctx) { const ed = document.getElementById(`note-ed-${type}-${id}-${ctx}`); if (ed) ed.style.display = 'none'; }
function refreshNotes(type, id, ctx, raw) {
  // refresh the calling context and the other one (detail ↔ modal) so nothing goes stale
  ['d','m'].forEach(c => {
    const wrap = document.getElementById(`notes-${type}-${id}-${c}`); if (!wrap) return;
    const tmp = document.createElement('div'); tmp.innerHTML = notesHtml(type, id, raw, c);
    wrap.replaceWith(tmp.firstElementChild);
  });
}
async function saveNote(type, id, ctx) {
  const ta = document.getElementById(`note-ta-${type}-${id}-${ctx}`);
  const text = (ta && ta.value || '').trim();
  if (!text) { toast('Note cannot be empty', 'error'); return; }
  const r = await api('PATCH', `${NOTE_API[type]}/${id}`, { addNote: text });
  if (!r?.success) { toast(r?.error || 'Error adding note', 'error'); return; }
  refreshNotes(type, id, ctx, r.data?.notes);
  toast('Note added', 'success');
}
async function deleteNote(type, id, noteId, ctx) {
  if (!confirm('Delete this note?')) return;
  const r = await api('PATCH', `${NOTE_API[type]}/${id}`, { deleteNoteId: noteId });
  if (!r?.success) { toast(r?.error || 'Error deleting note', 'error'); return; }

function fmtStatus(s) {
  const map = {
    prospect:'Prospect', qualified:'Qualified', hot_lead:'Hot Lead', negotiation:'Negotiation', won:'Won', lost:'Lost', cold:'Cold',
    new_inquiry:'New Inquiry', quoted:'Quoted', follow_up:'Follow Up', shipment_booked:'Shipment Booked', delivered:'Delivered', cancelled:'Cancelled',
    pending:'Pending', in_progress:'In Progress', completed:'Completed', overdue:'Overdue',
    high:'High', medium:'Medium', low:'Low',
    air:'Air', sea:'Sea', road:'Road', courier:'Courier',
  };
  return map[s] || s?.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) || s;
}
function roleLabel(r) { return {admin:'Admin',manager:'Manager',sales_rep:'Sales Rep'}[r]||r; }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtCur(v) { if (!v && v!==0) return '—'; const n = Number(v); if (isNaN(n)) return '—'; return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:0}); }
function emptyState(icon, title, sub) {

async function addTrackingEntry() {
  const statusText = document.getElementById('tl-status-text')?.value?.trim();
  if (!statusText) { toast('Status text is required', 'error'); return; }
  const location = document.getElementById('tl-location')?.value?.trim() || null;
  const statusDate = document.getElementById('tl-date')?.value || null;

  const r = await api('POST', `/api/tracking/${_trackId}/statuses`, {
    status_text: statusText, location, status_date: statusDate ? new Date(statusDate).toISOString() : undefined,
  });
  if (!r?.success) { toast(r?.error || 'Error adding status', 'error'); return; }

  _trackTimeline.push({ id: r.data.id, status: statusText, location, timestamp: r.data.timestamp });
  toast('Status added!', 'success');
  document.getElementById('tl-status-text').value = '';
  document.getElementById('tl-location').value = '';
  document.getElementById('tl-date').value = '';
  renderTrackingModal();
}

async function deleteTrackingEntry(idx) {
  const entry = _trackTimeline[idx];
  if (!entry) return;
  if (!confirm('Delete this status entry?')) return;
  const key = entry.id ?? idx;
  try {
    const r = await api('DELETE', `/api/tracking/${_trackId}/statuses/${key}`);
    if (!r?.success) { toast(r?.error || 'Error deleting entry', 'error'); return; }
    _trackTimeline.splice(idx, 1);
    toast('Status deleted', 'success');
    renderTrackingModal();
  } catch (e) {
    toast('Could not delete entry', 'error');
  }
}

function _parseAddress(s) {
  if (!s) return { city:'', state:'', pin:'', country:'', addr:'' };
  const pinM = s.match(/\b(\d{6})\b/);
  const pin = pinM ? pinM[1] : '';
  const parts = s.split(',').map(p => p.trim()).filter(Boolean);
  let city = '', state = '', country = '', addr = '';
  for (const p of parts) {
    if (/^\d{6}$/.test(p)) continue;
    if (/^(india|uae|usa|uk|singapore|german|france|australia|canada|japan|china)$/i.test(p)) { country = p; continue; }
    if (/^(gujarat|maharashtra|delhi|karnataka|tamil|rajasthan|uttar|madhya|west bengal|andhra|telangana|kerala|punjab|haryana|odisha|assam|jharkhand|chhattisgarh|goa|himachal|jammu|meghalaya|manipur|nagaland|tripura|mizoram|arunachal|sikkim|manipur|ukharakhand)$/i.test(p)) { state = p; continue; }
  }
  if (parts.length >= 2) { city = parts[parts.length > 3 ? 3 : 0] || ''; }
  if (!city && parts.length > 0) city = parts[0] || '';
  if (!state) { for (const p of parts) { if (p.length > 3 && !/^\d/.test(p) && !/^(india|air|sea|road|courier)/i.test(p)) { state = p; break; } } }
  addr = parts.filter(p => p !== city && p !== state && p !== country && !/^\d{6}$/.test(p)).slice(0, 2).join(', ');
  return { city: city || '', state: state || '', pin, country: country || 'India', addr };
}

    + '<td style="padding:4px"><button type="button" onclick="removePackingRow(this)" style="background:none;color:var(--gray2);font-size:14px;padding:2px 4px;border-radius:4px" onmouseover="this.style.color=\'#dc2626\';this.style.background=\'#fee2e2\'" onmouseout="this.style.color=\'var(--gray2)\';this.style.background=\'none\'">&times;</button></td>';

function removePackingRow(btn) {
  const tr = btn.closest('tr');
  if (tr) { tr.remove(); calcPackingGrand(); }
}
function calcPackingVol(input) {
  const tr = input.closest('tr');
  const l=parseFloat(tr.querySelector('[data-col="length"]').value)||0;
  const w=parseFloat(tr.querySelector('[data-col="width"]').value)||0;
  const h=parseFloat(tr.querySelector('[data-col="height"]').value)||0;
  const unit=(tr.querySelector('[data-col="unit"]').value||'cm').toLowerCase();
  if(l&&w&&h){
    let lcm=l, wcm=h, hcm=h;
    if(unit==='inch'){lcm=l*2.54;wcm=w*2.54;hcm=h*2.54;}
    else if(unit==='mm'){lcm=l/10;wcm=w/10;hcm=h/10;}
    else if(unit==='m'){lcm=l*100;wcm=w*100;hcm=h*100;}
    else if(unit==='ft'){lcm=l*30.48;wcm=w*30.48;hcm=h*30.48;}
    tr.querySelector('[data-col="volweight"]').value=(lcm*wcm*hcm/5000).toFixed(2);
  } else {
    tr.querySelector('[data-col="volweight"]').value='';
  }
  calcPackingTotal(input);
}
function calcPackingTotal(input) {
  const tr = input.closest('tr');
  const qty=parseFloat(tr.querySelector('[data-col="qty"]').value)||0;
  const valStr=tr.querySelector('[data-col="value"]').value||'';
  const val=valStr.split(',').map(s=>parseFloat(s.trim())||0).reduce((a,b)=>a+b,0);
  tr.querySelector('[data-col="total"]').value = (qty*val).toFixed(2);
  calcPackingGrand();
}
function calcPackingGrand() {
  let total=0;
  document.querySelectorAll('#mf-packing-body tr').forEach(tr=>{
    total += parseFloat(tr.querySelector('[data-col="total"]')?.value)||0;
  });
  const el = document.getElementById('mf-packing-grand');
  if (el) el.textContent = total.toFixed(2);
}

async function lookupLead() {
  const val = document.getElementById('mf-lookup').value.trim();
  const el = document.getElementById('lookup-result');
  if (!val) { el.innerHTML = '<span style="color:var(--red)">Please enter a Lead ID</span>'; return; }
  el.innerHTML = '<span style="color:var(--gray)">Looking up...</span>';

  let data = null;
  for (const type of ['shipment-leads', 'quote-leads', 'contacts']) {
    const r = await api('GET', `/api/${type}?search=${encodeURIComponent(val)}&limit=5`);
    const items = Array.isArray(r?.data) ? r.data : [];
    if (items.length > 0) { data = items[0]; break; }
  }

  if (!data) { el.innerHTML = '<span style="color:var(--red)">Lead not found</span>'; return; }

  // Sales rep must not load details of a record assigned to someone else
  if (rowLocked(data)) {
    el.innerHTML = `<span style="color:#dc2626">🔒 Assigned to <strong>${esc(data.assignedTo?.name || 'another user')}</strong> — you do not have access to this record</span>`;
    return;
  }

  const setVal = (id, v) => { const e = document.getElementById(id); if (e) e.value = v || ''; };
  setVal('mf-name', data.customerName || data.name);
  setVal('mf-company', data.company);
  setVal('mf-email', data.email);
  setVal('mf-phone', data.phone);
  setVal('mf-weight', data.weight);
  setVal('mf-declvalue', data.declaredValue || data.estimatedValue);

  const oAddr = _parseAddress(data.origin);
  setVal('mf-o-city', oAddr.city);
  setVal('mf-o-pin', oAddr.pin);
  setVal('mf-o-state', oAddr.state);
  setVal('mf-o-country', oAddr.country);
  setVal('mf-o-address1', data.address1);

  const dAddr = _parseAddress(data.destination);
  setVal('mf-d-city', dAddr.city);
  setVal('mf-d-pin', dAddr.pin);
  setVal('mf-d-state', dAddr.state);
  setVal('mf-d-country', dAddr.country);

  if (data.dimensions) {
    const p = data.dimensions.split('x');
    setVal('mf-len', p[0]); setVal('mf-wid', p[1]); setVal('mf-hgt', p[2]);
    calcDimWeight('b');
  }
  el.innerHTML = `<span style="color:var(--green)">✓ Loaded from <strong>${esc(data.leadId)}</strong> (${esc(data.customerName || data.name)})</span>`;
}

  // Responsive: stack columns on narrow screens

}

async function getBookRates(id) {
  const r = await api('GET', `/api/shipment-leads/${id}`);
  if (!r?.success) { toast('Lead not found', 'error'); return; }
  const l = r.data;

  if (l.shipmentType === 'international') {
    const pc = extractIntlPostcode(l.destination);
    const c = guessCountry(l.destination);
    const w = parseFloat(l.weight);
    const ready = w > 0 && pc && c && c !== 'IN';
    if (ready) {
      toast('Getting Rates', 'info');
      showShipGlobalBookingRates(l, { w, pc, c, auto: true });
    } else {
      showShipGlobalBookingRates(l, { w: w > 0 ? w : '', pc: pc || '', c: c || '' });
    }
    return;
  }

  const missing = [];
  if (!l.origin) missing.push('origin address');
  if (!l.destination) missing.push('destination address');
  if (!l.weight) missing.push('weight');
  if (!l.declaredValue) missing.push('declared value');
  if (missing.length) {
    toast(`Please fill ${missing.join(', ')} first`, 'error');
    return;
  }

  const extractPin = (s) => { const m = (s||'').match(/\b(\d{6})\b/); return m ? m[1] : null; };
  const sourcePin = extractPin(l.origin);
  const destPin = extractPin(l.destination);

  if (!sourcePin) {
    toast('Could not find 6-digit pincode in origin address. Please add pincode (e.g. Ahmedabad, Gujarat 380054).', 'error');
    return;
  }
  if (!destPin) {
    toast('Could not find 6-digit pincode in destination address. Please add pincode (e.g. Mumbai, Maharashtra 400001).', 'error');
    return;
  }

  const weightG = Math.round(l.weight * 1000);

  // Build dimensions from packing list (each row = 1 box)
  const packing = Array.isArray(l.packingList) ? l.packingList : [];
  let dimensions = [];
  if (packing.length > 0) {
    packing.forEach(p => {
      const pL = parseFloat(p.length) || 50;
      const pW = parseFloat(p.width) || 40;
      const pH = parseFloat(p.height) || 30;
      dimensions.push({ length_cm: pL, width_cm: pW, height_cm: pH, box_count: 1 });
    });
  }
  // Fallback to lead-level dimensions if no packing list
  if (dimensions.length === 0) {
    const parseDimArr = (s) => { if(!s) return [50,40,30]; const p=s.split('x').map(Number); return [p[0]||50,p[1]||40,p[2]||30]; };
    const [dL,dW,dH] = parseDimArr(l.dimensions);
    dimensions = [{ length_cm: dL, width_cm: dW, height_cm: dH, box_count: 1 }];
  }

  toast('Getting Rates', 'info');
  const rateR = await api('POST', '/api/delhivery/rate', {
    source_pin: sourcePin,
    consignee_pin: destPin,
    weight_g: weightG,
    inv_amount: l.declaredValue,
    dimensions: dimensions,
    payment_mode: 'prepaid',
  });

  if (!rateR) {
    toast('Session expired. Please log in again.', 'error');
    return;
  }
  if (!rateR.success) {
    toast(rateR.error || 'Failed to get rates from Delhivery', 'error');
    return;
  }

  const rateData = rateR.data;
  await api('PATCH', `/api/shipment-leads/${id}`, { delhiveryRate: rateData.finalRate, chargedWeight: rateData.chargedWeight });

  // Clean breakup: skip internal/zero fields, use friendly labels
  const SKIP = ['pre_tax_freight_charges','gst_percent','meta_charges','markup','green','lm','appointment_charges','other_handling_charges'];
  const LABELS = { base_freight_charge:'Base Freight', fuel_surcharge:'Fuel Surcharge', fuel_hike:'Fuel Hike', insurance_rov:'Insurance / ROV', oda:'ODA Charges', fm:'FM Charges', gst:'GST (18%)' };
  const breakup = rateData.priceBreakup ? Object.entries(rateData.priceBreakup)
    .filter(([k,v]) => !SKIP.includes(k) && v != null && !isNaN(Number(v)) && Number(v) > 0)
    .map(([k,v]) => ({ label: LABELS[k] || k.replace(/_/g,' '), amount: Number(v) })) : [];

  // Calculate volumetric weight breakdown from packing list
  let volWeightRows = '';
  let totalVolWt = 0;
  if (packing.length > 0) {
    packing.forEach((p, i) => {
      const len = parseFloat(p.length) || 0;
      const wid = parseFloat(p.width) || 0;
      const hgt = parseFloat(p.height) || 0;
      const unit = (p.unit || 'cm').toLowerCase();
      const divisor = unit === 'in' ? 139 : 4500;
      const volWt = (len * wid * hgt) / divisor;
      totalVolWt += volWt;
      volWeightRows += `<tr><td style="padding:6px 12px;font-size:12px;color:var(--gray);border-bottom:1px solid var(--gray3)">${i+1}. ${len}×${wid}×${hgt}${unit}</td><td style="padding:6px 12px;font-size:12px;text-align:right;border-bottom:1px solid var(--gray3)">${volWt.toFixed(2)} kg</td></tr>`;
    });
  }

  showModal('Rate Card', `
    <div style="background:var(--white);border-radius:10px;overflow:hidden;border:1px solid var(--gray3)">
      ${me?.role === 'admin' ? `
      <!-- Admin: full breakup with prices -->
      <div style="padding:14px 16px">
        <div style="background:var(--gray4);border-radius:10px;padding:14px 16px">
          ${breakup.map(item => `
          <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--gray3)">
            <span style="color:var(--gray)">${item.label}</span>
            <span style="color:var(--black);font-weight:500">₹${item.amount.toLocaleString()}</span>
          </div>`).join('')}
          <div style="display:flex;justify-content:space-between;padding:8px 0 4px;font-size:14px;font-weight:700;border-top:2px solid var(--gray3);margin-top:4px">
            <span>Total</span>
            <span>₹${rateData.delhiveryRate.toLocaleString()}</span>
          </div>
        </div>
      </div>
      ` : `
      <!-- Manager/Sales Rep: names only, no prices, in dropdown -->
      <div style="padding:12px 16px">
        <details style="background:var(--gray4);border-radius:10px;overflow:hidden">
          <summary style="padding:10px 16px;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px">
            <span style="font-size:10px">▼</span> Price Break Down
          </summary>
          <div style="padding:0 16px 12px">
            ${breakup.map(item => `
            <div style="padding:4px 0;font-size:12px;color:var(--gray);border-bottom:1px solid var(--gray3)">${item.label}</div>`).join('')}
          </div>
        </details>
      </div>
      `}
      <!-- YNC Final Rate -->
      <div style="padding:0 16px 14px">
        <div style="background:var(--brand-bg);border:2px solid var(--brand-border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand)">YNC Rate</div>
            <div style="font-size:10px;color:var(--gray);margin-top:2px">Inclusive of all charges</div>
          </div>
          <div style="font-size:22px;font-weight:800;color:var(--brand-dark)">₹${rateData.finalRate.toLocaleString()}</div>
        </div>
      </div>
    </div>
    <!-- Weights -->
    <div style="margin-top:10px;font-size:12px;color:var(--gray2);display:flex;gap:16px;flex-wrap:wrap">
      <span>Physical: <strong style="color:var(--black)">${l.weight || '—'} kg</strong></span>
      <span>Chargeable: <strong style="color:var(--black)">${rateData.chargedWeight ? rateData.chargedWeight+'kg' : '—'}</strong></span>
      ${totalVolWt > 0 ? `<span>Volumetric: <strong style="color:var(--black)">${totalVolWt.toFixed(2)} kg</strong></span>` : ''}
    </div>
    ${volWeightRows ? `
    <div style="margin-top:10px;background:var(--gray4);border-radius:8px;padding:8px 0">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="border-bottom:1px solid var(--gray3)">
          <th style="padding:6px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);text-align:left">Dimensions</th>
          <th style="padding:6px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);text-align:right">Vol. Weight</th>
        </tr></thead>
        <tbody>${volWeightRows}</tbody>
        <tfoot><tr style="font-weight:700;border-top:1px solid var(--gray3)">
          <td style="padding:6px 12px;font-size:11px;text-align:right">Total Volumetric</td>
          <td style="padding:6px 12px;font-size:11px;text-align:right">${totalVolWt.toFixed(2)} kg</td>
        </tr></tfoot>
      </table>
    </div>` : ''}
  `, () => { closeModal(); });

async function executeBookShipment(id) {
  const r = await api('GET', `/api/shipment-leads/${id}`);
  if (!r?.success) { toast('Lead not found', 'error'); return; }
  const l = r.data;

  if (!l.origin || !l.destination || !l.weight || !l.declaredValue) {
    toast('Please fill origin, destination, weight, and declared value', 'error');
    return;
  }

  const extractPin = (s) => { const m = (s||'').match(/\b(\d{6})\b/); return m ? m[1] : null; };
  const sourcePin = extractPin(l.origin);
  const destPin = extractPin(l.destination);

  if (!sourcePin || !destPin) {
    toast('Could not extract 6-digit pincode from origin/destination', 'error');
    return;
  }

  const dAddr = _parseAddress(l.destination);

  // Build dimensions from packing list (each row = 1 box)
  const packing = Array.isArray(l.packingList) ? l.packingList : [];
  let manifestDimensions = [];
  let totalQty = 0;
  if (packing.length > 0) {
    packing.forEach(p => {
      const pL = parseFloat(p.length) || 50;
      const pW = parseFloat(p.width) || 40;
      const pH = parseFloat(p.height) || 30;
      const q = parseInt(p.qty) || 1;
      totalQty += q;
      manifestDimensions.push({ length_cm: pL, width_cm: pW, height_cm: pH, box_count: 1 });
    });
  }
  if (manifestDimensions.length === 0) {
    const parseDimArr = (s) => { if(!s) return [50,40,30]; const p=s.split('x').map(Number); return [p[0]||50,p[1]||40,p[2]||30]; };
    const [dL,dW,dH] = parseDimArr(l.dimensions);
    manifestDimensions = [{ length_cm: dL, width_cm: dW, height_cm: dH, box_count: 1 }];
    totalQty = l.numberOfPackages || 1;
  }

  // Build shipment_details from packing list
  let shipmentDetails = [];
  if (packing.length > 0) {
    packing.forEach(p => {
      shipmentDetails.push({
        desc: p.description || 'General goods',
        qty: parseInt(p.qty) || 1,
        value: parseFloat(p.total) || 0,
      });
    });
  } else {
    shipmentDetails = [{ desc: l.cargoType || 'General goods', qty: totalQty, value: l.declaredValue }];
  }

  const cleanPhone = (p) => { if(!p) return ''; const d = p.replace(/\D/g,''); if(d.length===10) return d; if(d.length===12 && d.startsWith('91')) return d.slice(2); if(d.length===13 && d.startsWith('091')) return d.slice(3); return d.slice(-10); };

  toast('Creating manifest with Delhivery...', 'info');

  const manifestR = await api('POST', '/api/delhivery/manifest', {
    payment_mode: 'prepaid',
    weight: Math.round(l.weight * 1000),
    dropoff_location: {
      consignee_name: l.receiverName || l.customerName || '',
      address: l.destAddress1 || l.address1 || '',
      address_1: l.destAddress2 || l.address2 || '',
      address_2: l.destAddress3 || l.address3 || '',
      city: dAddr.city,
      state: dAddr.state,
      pin: destPin,
      phone: cleanPhone(l.receiverPhone || l.phone || ''),
    },
    shipment_details: shipmentDetails,
    dimensions: manifestDimensions,
    inv_amount: l.declaredValue,
    rov_insurance: false,
    freight_mode: 'fop',
    fm_pickup: true,
  });

  if (!manifestR) { toast('Session expired. Please log in again.', 'error'); return; }
  if (!manifestR.success) { toast(manifestR.error || 'Failed to create manifest with Delhivery', 'error'); return; }

  const jobId = manifestR.data?.job_id;
  if (!jobId) { toast('No job_id received from Delhivery', 'error'); return; }

  await api('PATCH', `/api/shipment-leads/${id}`, { delhiveryJobId: jobId });
  _invalidateBookCache();
  toast('Manifest created. Polling for LR/AWB...', 'info');

  let lr = null, awb = null;
  for (let i = 0; i < 15; i++) {
    await new Promise(resolve => setTimeout(resolve, 3000));
    const statusR = await api('GET', `/api/delhivery/status?job_id=${jobId}`);
    if (statusR?.success) {
      const entries = statusR.data?.entries || statusR.data?.manifest_entry || [];
      if (Array.isArray(entries)) {
        for (const e of entries) {
          if (e.lr_no || e.lrn) { lr = e.lr_no || e.lrn; awb = e.awb || e.tracking_id; break; }
        }
      }
      if (lr) break;
      if (statusR.data?.lr_no || statusR.data?.lrn) { lr = statusR.data.lr_no || statusR.data.lrn; awb = statusR.data.awb || statusR.data.tracking_id; break; }
    }
  }

  if (lr) {
    await api('PATCH', `/api/shipment-leads/${id}`, {
      delhiveryLr: lr, delhiveryAwb: awb, status: 'shipment_booked',
    });
    _invalidateBookCache();
    toast(`Shipment booked! LR: ${lr}`, 'success');
    showBookShipmentDetail(id);
  } else {
    toast('Manifest submitted but LR/AWB not yet available. Check back in a few minutes.', 'info');
    showBookShipmentDetail(id);
  }
}

async function downloadLabel(lrn) {
  if (!lrn) { toast('No LR number available', 'error'); return; }
  toast('Generating label...', 'info');
  const r = await api('GET', `/api/delhivery/label?lrn=${encodeURIComponent(lrn)}&size=a4`);
  if (!r?.success) { toast(r?.error || 'Failed to get label', 'error'); return; }

  const urls = r.data?.urls || r.data;
  let labelHtml = '';
  if (Array.isArray(urls)) {
    for (const url of urls) {
      if (url.base64) {
        labelHtml += `<div style="text-align:center;margin:10px 0"><img src="data:image/png;base64,${url.base64}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
      } else if (url.url) {
        labelHtml += `<div style="text-align:center;margin:10px 0"><img src="${url.url}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
      }
    }
  } else if (urls?.base64) {
    labelHtml = `<div style="text-align:center"><img src="data:image/png;base64,${urls.base64}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
  } else if (urls?.url) {
    labelHtml = `<div style="text-align:center"><img src="${urls.url}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
  }

  if (!labelHtml) { toast('No label data received', 'error'); return; }

  showModal(`Label — ${lrn}`, `
    <div style="max-height:70vh;overflow-y:auto">${labelHtml}</div>
  `, () => { closeModal(); });
}

async function deleteBookShipment(id) {
  if (!confirm('Delete this booking?')) return;
  const r = await api('DELETE', `/api/shipment-leads/${id}`);
  if (r?.success) { toast('Deleted', 'success'); _invalidateBookCache(); renderBookShipment(); }
  else toast(r?.error || 'Error', 'error');
}
</script>
