<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>YNC CRM</title>
<style>
:root{
  --brand:#8B0000;
  --brand-dark:#5a0000;
  --brand-light:#b30000;
  --brand-bg:#fff5f5;
  --brand-border:#f5cccc;
  --black:#111;
  --gray:#64748b;
  --gray2:#94a3b8;
  --gray3:#e2e8f0;
  --gray4:#f8fafc;
  --white:#fff;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --orange:#ea580c;
  --orange-bg:#fff7ed;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --yellow:#ca8a04;
  --yellow-bg:#fefce8;
  --purple:#7c3aed;
  --purple-bg:#f3e8ff;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:var(--black);min-height:100vh}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none}
a{text-decoration:none;color:inherit}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#5a0000 0%,#8B0000 50%,#b30000 100%)}
.auth-card{background:var(--white);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .logo-ync{font-size:42px;font-weight:900;color:var(--brand);letter-spacing:-2px;line-height:1}
.auth-logo .logo-sub{font-size:11px;letter-spacing:4px;color:var(--gray);text-transform:uppercase;margin-top:4px}
.auth-logo .logo-tagline{font-size:13px;color:var(--gray);margin-top:8px}
.auth-tabs{display:flex;border-bottom:2px solid var(--gray3);margin-bottom:24px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.auth-tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1.5px solid var(--gray3);border-radius:var(--radius);font-size:14px;transition:border .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--brand)}
.btn-primary{width:100%;padding:12px;background:var(--brand);color:var(--white);border-radius:var(--radius);font-size:15px;font-weight:700;transition:background .2s;margin-top:4px}
.btn-primary:hover{background:var(--brand-dark)}
.auth-error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.auth-error.show{display:block}

/* LAYOUT */
#app{display:none;height:100vh;overflow:hidden;flex-direction:row}
#app.show{display:flex}
#sidebar{width:200px;min-width:200px;background:var(--brand-dark);display:flex;flex-direction:column;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--white);border-bottom:1px solid var(--gray3);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px}

/* SIDEBAR */
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo .s-ync{font-size:28px;font-weight:900;color:#fff;letter-spacing:-1px}
.sidebar-logo .s-crm{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.6);text-transform:uppercase;margin-top:2px}
.sidebar-logo .s-tag{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}
.sidebar-nav{padding:12px 8px;flex:1}
.nav-section{margin-bottom:6px}
.nav-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.75);font-size:13.5px;font-weight:500;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item .ni{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--brand-light);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.su-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.su-name{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.su-role{font-size:11px;color:rgba(255,255,255,.5)}
.su-logout{margin-left:auto;background:none;color:rgba(255,255,255,.5);font-size:18px;padding:4px;border-radius:6px;transition:color .2s}
.su-logout:hover{color:#fff}

/* TOPBAR */
.topbar-title{font-size:18px;font-weight:700;color:var(--black)}
.topbar-right{display:flex;align-items:center;gap:12px}
.btn-add{background:var(--brand);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-add:hover{background:var(--brand-dark)}
.search-box{position:relative}
.search-box input{padding:8px 12px 8px 34px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;width:280px;transition:border .2s}
.search-box input:focus{border-color:var(--brand)}
.search-box .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray2);font-size:15px}
/* universal (global) search dropdown */
.global-results{position:absolute;top:calc(100% + 8px);right:0;width:440px;max-width:min(440px,92vw);max-height:72vh;overflow:auto;background:var(--white);border:1px solid var(--gray3);border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.16);z-index:90;padding:6px}
.gr-group{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray2);padding:10px 10px 4px;display:flex;justify-content:space-between}
.gr-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.gr-item:hover{background:var(--gray4)}
.gr-item .gr-ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.gr-item .gr-title{font-size:13px;font-weight:700;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-item .gr-sub{font-size:11.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-empty{padding:14px;font-size:12.5px;color:var(--gray);text-align:center}
.gr-loading{padding:12px;font-size:12.5px;color:var(--gray);text-align:center}

/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--brand)}
.stat-card.green{border-left-color:var(--green)}
.stat-card.blue{border-left-color:var(--blue)}
.stat-card.orange{border-left-color:var(--orange)}
.stat-card.purple{border-left-color:var(--purple)}
.stat-label{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:28px;font-weight:500;color:var(--black);margin-top:6px;line-height:1}
.stat-sub{font-size:12px;color:var(--gray2);margin-top:4px}

/* TABLE */
.table-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
.book-tbl th,.book-tbl td{padding:9px 8px}
.book-tbl td{font-size:13px}
.book-tbl .row-status{max-width:145px}
.table-header{padding:16px 20px;border-bottom:1px solid var(--gray3);display:flex;align-items:center;justify-content:space-between}
.table-title{font-size:15px;font-weight:700}
.table-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-select{padding:6px 10px;border:1.5px solid var(--gray3);border-radius:7px;font-size:13px;color:var(--black);background:var(--white)}
.filter-select:focus{border-color:var(--brand);outline:none}
table{width:100%;border-collapse:collapse}
thead th{background:var(--gray4);padding:10px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray3)}
tbody tr{border-bottom:1px solid var(--gray3);transition:background .1s;cursor:pointer}
tbody tr:hover{background:var(--brand-bg)}
tbody tr:last-child{border-bottom:none}
td{padding:12px 16px;font-size:13.5px;vertical-align:middle}
.avatar-cell{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-bg);border:1.5px solid var(--brand-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0}
.av.sm{width:26px;height:26px;font-size:10px}
.cell-name{font-weight:600;color:var(--black)}
.cell-sub{font-size:12px;color:var(--gray2);margin-top:1px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge-prospect{background:#f1f5f9;color:#475569}
.badge-qualified{background:var(--blue-bg);color:var(--blue)}
.badge-hot_lead{background:#fff7ed;color:#c2410c}
.badge-negotiation{background:var(--yellow-bg);color:var(--yellow)}
.badge-won{background:var(--green-bg);color:var(--green)}
.badge-lost{background:#fee2e2;color:#dc2626}
.badge-cold{background:#f1f5f9;color:#94a3b8}
/* lead statuses (unified) */
.badge-new_inquiry{background:var(--blue-bg);color:var(--blue)}
.badge-quoted{background:var(--yellow-bg);color:var(--yellow)}
.badge-follow_up{background:#fff7ed;color:#c2410c}
.badge-shipment_booked{background:var(--green-bg);color:var(--green)}
.badge-delivered{background:#052e16;color:#86efac}
.badge-cancelled{background:#fee2e2;color:#dc2626}
/* task */
.badge-pending{background:var(--yellow-bg);color:var(--yellow)}
.badge-in_progress{background:var(--blue-bg);color:var(--blue)}
.badge-completed{background:var(--green-bg);color:var(--green)}
.badge-overdue{background:#fee2e2;color:#dc2626}
.badge-on_hold{background:var(--yellow-bg);color:var(--yellow)}
/* task row actions: status segmented control + edit/delete */
.task-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tseg{display:inline-flex;border:1.5px solid var(--gray3);border-radius:6px;background:var(--white);overflow:hidden}
.tseg button{border:0;border-right:1px solid var(--gray3);background:var(--white);color:var(--gray);font-size:11.5px;font-weight:600;padding:4px 8px;cursor:pointer;white-space:nowrap;font-family:inherit}
.tseg button:last-child{border-right:0}
.tseg button:hover{background:var(--gray4);color:var(--black)}
.tseg button.is-done{background:#15803d;color:#fff}
.tseg button.is-hold{background:#b45309;color:#fff}
.tseg button.is-cancel{background:#dc2626;color:#fff}
.tseg button.is-done:hover,.tseg button.is-hold:hover,.tseg button.is-cancel:hover{filter:brightness(1.08);color:#fff}
.tbtn{border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.tbtn-edit{background:var(--brand-bg);color:var(--brand);border:1.5px solid var(--brand-border)}
.tbtn-edit:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.tbtn-del{background:#fee2e2;color:#dc2626;border:1.5px solid #fecaca}
.tbtn-del:hover{background:#dc2626;color:#fff;border-color:#dc2626}
.task-acts button:focus-visible,.tbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* priority */
.badge-high{background:#fee2e2;color:#dc2626}
.badge-medium{background:var(--yellow-bg);color:var(--yellow)}
.badge-low{background:var(--green-bg);color:var(--green)}
/* shipment mode */
.badge-air{background:var(--blue-bg);color:var(--blue)}
.badge-sea{background:var(--purple-bg);color:var(--purple)}
.badge-road{background:var(--green-bg);color:var(--green)}
.badge-courier{background:#fff7ed;color:#c2410c}
/* category badges */
.badge-logistics{background:var(--blue-bg);color:var(--blue)}
.badge-ecommerce{background:var(--purple-bg);color:var(--purple)}
.badge-customs{background:var(--orange-bg);color:var(--orange)}
.badge-moving{background:var(--green-bg);color:var(--green)}
.badge-warehousing{background:var(--yellow-bg);color:var(--yellow)}
/* sub-nav category filters */
.cat-filters{padding:2px 0 6px 0}
.cat-filter{display:block;padding:5px 12px 5px 42px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border-radius:6px;transition:all .15s;margin-bottom:1px}
.cat-filter:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.cat-filter.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:960px}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--gray3);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:17px;font-weight:700}
.modal-close{background:none;font-size:22px;color:var(--gray);padding:4px;border-radius:6px;line-height:1}
.modal-close:hover{color:var(--black)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--gray3);display:flex;justify-content:flex-end;gap:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--gray);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13.5px;transition:border .2s;color:var(--black);background:var(--white)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand)}
.fg textarea{resize:vertical;min-height:70px}
.btn-cancel{padding:9px 20px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;color:var(--gray);background:var(--white)}
.btn-cancel:hover{background:var(--gray4)}
.btn-save{padding:9px 24px;background:var(--brand);color:#fff;border-radius:8px;font-size:13px;font-weight:700}
.btn-save:hover{background:var(--brand-dark)}
.btn-danger{padding:9px 20px;background:#dc2626;color:#fff;border-radius:8px;font-size:13px;font-weight:700}
.btn-get-rates{padding:8px 16px;background:#fef3c7;color:#92400e;border:1.5px solid #fcd34d;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-get-rates:hover{background:#fde68a}
.btn-book{padding:8px 16px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-book:hover{background:var(--brand-dark)}
.btn-label{padding:8px 16px;background:#ede9fe;color:#6d28d9;border:1.5px solid #c4b5fd;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-label:hover{background:#ddd6fe}
.btn-edit{padding:8px 16px;background:var(--white);color:var(--gray);border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-edit:hover{background:var(--gray4)}
.btn-delete{padding:8px 16px;background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-delete:hover{background:#fee2e2}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.detail-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--gray2)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--gray);margin-bottom:6px}
.empty-sub{font-size:13px}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--gray3);font-size:13px;color:var(--gray)}
.page-btns{display:flex;gap:6px}
.page-btn{padding:6px 12px;border:1.5px solid var(--gray3);border-radius:7px;font-size:13px;background:var(--white);color:var(--gray);font-weight:600}
.page-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.page-btn:disabled{opacity:.4;cursor:default}
.page-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* DETAIL PANEL */
.detail-panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
.dp-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.dp-name{font-size:20px;font-weight:800}
.dp-company{font-size:14px;color:var(--gray);margin-top:3px}
.dp-actions{display:flex;gap:8px}
.btn-edit{padding:7px 16px;background:var(--brand-bg);color:var(--brand);border:1.5px solid var(--brand-border);border-radius:8px;font-size:13px;font-weight:600}
.btn-edit:hover{background:var(--brand);color:#fff}
.btn-back{padding:7px 14px;background:var(--gray4);border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;color:var(--gray);display:flex;align-items:center;gap:6px}
.btn-back:hover{background:var(--gray3)}
.dp-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dp-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray2);margin-bottom:3px;display:block}
.dp-field span{font-size:14px;color:var(--black);font-weight:500}
.section-title{font-size:14px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--gray3)}

/* DASHBOARD QUICK */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.quick-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.quick-card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray3)}
.activity-item:last-child{border:none}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:5px}
.act-title{font-size:13px;font-weight:500}
.act-time{font-size:11px;color:var(--gray2)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slideIn .3s ease}
.toast-item.success::before{content:'✅'}
.toast-item.error::before{content:'❌'}
.toast-item.info::before{content:'ℹ️'}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ROLE BADGE */
.role-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.role-admin{background:#fee2e2;color:#991b1b}
.role-manager{background:var(--blue-bg);color:#1d4ed8}
.role-sales_rep{background:var(--green-bg);color:#15803d}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--gray2);font-size:14px}
.spinner{width:28px;height:28px;border:3px solid var(--gray3);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TABS */
.tab-strip{display:flex;gap:4px;background:var(--gray4);padding:4px;border-radius:10px;margin-bottom:20px;width:fit-content}
.tab-btn{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--gray);background:none;transition:all .15s}

// Row actions on Tasks: Done / Hold / Cancel map onto these statuses (must match the Prisma enum).
const TASK_STATUSES = ['pending','in_progress','completed','overdue','on_hold','cancelled'];
const TASK_ACT_TOAST = { completed:'Task marked as Done', on_hold:'Task put on Hold', cancelled:'Task cancelled', pending:'Task moved back to Pending' };

// ─── API CACHE ──────────────────────────────────────────────────────────────
const _apiCache = new Map();
const CACHE_TTL = 60000; // 60s auto-refresh

function cacheKey(method, path) { return `${method}:${path}`; }

function invalidateCache(pathPrefix) {
  for (const k of _apiCache.keys()) {
    if (k.split(':')[1]?.startsWith(pathPrefix)) _apiCache.delete(k);
  }
}

// ─── API HELPER ────────────────────────────────────────────────────────────
async function api(method, path, body) {
  if (method === 'GET' && !body) {
    const ck = cacheKey(method, path);
    const cached = _apiCache.get(ck);
    if (cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
    if (cached) _apiCache.delete(ck); // expired
  }
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const j = await r.json();
  if (!j.success && r.status === 401) { doLogout(); return null; }
  if (method === 'GET' && j.success) _apiCache.set(cacheKey(method, path), { data: j, ts: Date.now() });
  if (method !== 'GET' && j.success) { invalidateCache(path.split('?')[0].replace(/\/[^/]*$/, '')); }
  if (!j.success && typeof j.error === 'string' && me && me.role !== 'admin') {
    j.error = j.error.replace(/shipglobal/ig, 'our intl partner').replace(/delhivery/ig, 'our courier partner');
  }
  return j;
}

let _refreshTimer = null;
let _viewingDetail = false;
function startAutoRefresh() {
  if (_refreshTimer) clearInterval(_refreshTimer);
  _refreshTimer = setInterval(() => {
    if (!token || !curPage || _viewingDetail) return;
    const modalOpen = document.getElementById('modal-overlay')?.classList.contains('show');
    if (modalOpen) return;
    // don't yank the page away while the user is picking an inline status
    if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('row-status')) return;
    const pageMap = {
      'dashboard':     ['/api/reports?type=summary', '/api/reports?type=activity&range=month'],
      'contacts':      ['/api/contacts?page=1&limit=15'],
      'quote-leads':   ['/api/quote-leads?page=1&limit=15'],
      'shipment-leads':['/api/shipment-leads?page=1&limit=15'],
      'book-shipment': ['/api/shipment-leads?source=booking&page=1&limit=15'],
      'tasks':         ['/api/tasks?page=1&limit=15'],
      'invoices':      ['/api/invoices?page=1&limit=15'],
      'gst-invoices':  ['/api/invoices?paymentStatus=paid&limit=500'],
    };
    const urls = pageMap[curPage];
    if (urls) {
      urls.forEach(u => _apiCache.delete(cacheKey('GET', u)));
      if (curPage === 'book-shipment') _invalidateBookCache(); // also clears filtered variants
      renderPage(curPage);
    }
  }, 15000);
}

function preloadAll() {
  const pages = [
    '/api/reports?type=summary',
    '/api/reports?type=activity&range=month',
    '/api/contacts?page=1&limit=15',
    '/api/quote-leads?page=1&limit=15',
    '/api/shipment-leads?page=1&limit=15',
    '/api/shipment-leads?page=1&limit=15&source=booking',
    '/api/tasks?page=1&limit=15',
  ];
  if (me.role === 'admin' || me.role === 'manager') pages.push('/api/users');
  pages.forEach(p => api('GET', p));
}

// ─── AUTH ──────────────────────────────────────────────────────────────────
function switchAuthTab(t) {
  document.querySelectorAll('.auth-tab').forEach((el,i) => el.classList.toggle('active', (t==='login'&&i===0)||(t==='register'&&i===1)));
  document.getElementById('tab-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('tab-register').style.display = t==='register' ? '' : 'none';
  clearAuthErr();
}
function showAuthErr(msg) { const e = document.getElementById('auth-error'); e.textContent = msg; e.classList.add('show'); }
function clearAuthErr()   { const e = document.getElementById('auth-error'); e.classList.remove('show'); }

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  if (!email || !pass) { showAuthErr('Email and password are required'); return; }
  clearAuthErr();
  const r = await fetch(API + '/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pass })
  }).then(x => x.json()).catch(() => null);
  if (!r || !r.success) { showAuthErr(r?.error || 'Login failed'); return; }
  token = r.data.token; me = r.data.user;
  localStorage.setItem('ync_token', token);
  localStorage.setItem('ync_me', JSON.stringify(me));
  initApp();
}

async function doRegister() {
  const name    = document.getElementById('reg-name').value.trim();
  const email   = document.getElementById('reg-email').value.trim();
  const pass    = document.getElementById('reg-password').value;
  const company = document.getElementById('reg-company').value.trim();
  if (!name || !email || !pass) { showAuthErr('Name, email and password are required'); return; }
  clearAuthErr();
  const r = await fetch(API + '/api/auth/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, password: pass, company })
  }).then(x => x.json()).catch(() => null);
  if (!r || !r.success) { showAuthErr(r?.error || 'Registration failed'); return; }
  token = r.data.token; me = r.data.user;
  localStorage.setItem('ync_token', token);
  localStorage.setItem('ync_me', JSON.stringify(me));
  initApp();
}

async function doLogout() {
  if (token) await fetch(API + '/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }).catch(() => {});
  token = ''; me = null;
  _apiCache.clear();
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
  localStorage.removeItem('ync_token'); localStorage.removeItem('ync_me');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('show');
}

// ─── INIT ──────────────────────────────────────────────────────────────────
function initApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('su-avatar').textContent = me.avatar || me.name?.slice(0,2).toUpperCase() || '??';
  document.getElementById('su-name').textContent   = me.name;
  document.getElementById('su-role').textContent   = roleLabel(me.role);
  if (me.role === 'admin' || me.role === 'manager') {
    document.getElementById('nav-section-admin').style.display = '';
    if (me.role === 'admin') document.getElementById('nav-gst-invoices').style.display = '';
  }
  nav(localStorage.getItem('ync_page') || 'dashboard');
  preloadAll();
  startAutoRefresh();
}

window.onload = () => {
  // Check invite token in URL
  const params = new URLSearchParams(location.search);
  const invite = params.get('invite');
  if (invite) {
    switchAuthTab('register');
    document.getElementById('auth-screen').style.display = 'flex';
    window._inviteToken = invite;
    return;
  }
  if (token && me) { initApp(); }
  else { document.getElementById('auth-screen').style.display = 'flex'; }
};

function nav(page) {
  setActivePage(page);
  curSearch = '';
  document.getElementById('search-input').value = '';

  renderPage(page);

function onSearch(v) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    curSearch = v.trim();
    curPageNum = 1;
    if (curPage === 'book-shipment') bookShipmentPage = 1;
    const listPages = ['contacts','quote-leads','shipment-leads','book-shipment','tasks','users','invoices','gst-invoices'];
    if (listPages.includes(curPage)) renderPage(curPage);
    if (curSearch.length >= 2) globalSearch(curSearch); else hideGlobalResults();
  }, 350);
}

function onSearchKey(e) {
  if (e.key === 'Escape') { hideGlobalResults(); return; }
  if (e.key === 'Enter') {
    const first = document.querySelector('#global-results .gr-item');
    if (first) { e.preventDefault(); first.click(); }
  }
}

// ─── UNIVERSAL SEARCH — one bar searches across every module ───────────────
let _gsToken = 0, _gsFlat = [];
function hideGlobalResults() { const el = document.getElementById('global-results'); if (el) { el.style.display = 'none'; el.innerHTML = ''; } _gsFlat = []; }

function globalSearchGroups(q) {
  const qs = 'search=' + encodeURIComponent(q) + '&limit=6';
  return [
    { icon: '💬', label: 'Quote Leads', url: '/api/quote-leads?' + qs, page: 'quote-leads',
      map: x => ({ id: x.id, title: x.customerName || x.leadId || 'Lead', sub: [x.leadId, x.company, x.destination].filter(Boolean).join(' · '), open: () => viewQuoteLead(x.id) }) },
    { icon: '🚢', label: 'Shipments & Bookings', url: '/api/shipment-leads?' + qs, page: 'shipment-leads',
      map: x => ({ id: x.id, page: x.source === 'booking' ? 'book-shipment' : 'shipment-leads', title: x.customerName || x.leadId || 'Shipment', sub: [x.leadId, [x.origin, x.destination].filter(Boolean).join(' → '), fmtStatus(x.status)].filter(Boolean).join(' · '), open: () => x.source === 'booking' ? showBookShipmentDetail(x.id) : viewShipmentLead(x.id) }) },
    { icon: '👥', label: 'Contacts', url: '/api/contacts?' + qs, page: 'contacts',
      map: x => ({ id: x.id, title: x.name || 'Contact', sub: [x.leadId, x.phone, x.email].filter(Boolean).join(' · '), open: () => viewContact(x.id) }) },
    { icon: '🧾', label: 'Invoices', url: '/api/invoices?' + qs, page: 'invoices',
      map: x => ({ id: x.id, title: x.invoiceNo || 'Invoice', sub: [x.customerName, invMoney(x.total), payBadgeText(x.paymentStatus)].filter(Boolean).join(' · '), open: () => viewInvoice(x.id, 'invoices') }) },
    { icon: '✅', label: 'Tasks', url: '/api/tasks?' + qs, page: 'tasks',
      map: x => ({ id: x.id, title: x.title || 'Task', sub: [fmtStatus(x.status), x.priority ? x.priority + ' priority' : ''].filter(Boolean).join(' · '), open: () => { setActivePage('tasks'); renderPage('tasks'); openTaskModal(x); } }) },
    { icon: '👤', label: 'Team', url: '/api/users', page: 'users', local: q,
      map: x => ({ id: x.id, title: x.name || 'Member', sub: [roleLabel(x.role), x.title, x.email].filter(Boolean).join(' · '), open: () => { setActivePage('users'); renderPage('users'); } }) },
  ];
}
function payBadgeText(s) { return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : ''; }

async function globalSearch(q) {
  const token = ++_gsToken;
  const el = document.getElementById('global-results'); if (!el) return;
  el.style.display = 'block';
  el.innerHTML = `<div class="gr-loading">⏳ Searching everywhere...</div>`;
  const groups = globalSearchGroups(q);
  const results = await Promise.all(groups.map(g => api('GET', g.url)));
  if (token !== _gsToken) return;
  let html = '', flat = [];
  groups.forEach((g, gi) => {
    const r = results[gi];
    let rows = (r?.success && Array.isArray(r.data) ? r.data : []);
    if (g.local) { // team list has no server-side search — filter locally
      const needle = g.local.toLowerCase();
      rows = rows.filter(x => [x.name, x.email, x.title, x.role].filter(Boolean).join(' ').toLowerCase().includes(needle));
    }
    const items = rows.slice(0, 6).map(g.map);
    if (!items.length) return;
    html += `<div class="gr-group"><span>${g.icon} ${g.label}</span><span>${items.length}</span></div>`;
    items.forEach(it => {
      flat.push({ page: g.page, item: it });
      html += `<div class="gr-item" onclick="openGlobalResult(${flat.length - 1})">
        <span class="gr-ico">${g.icon}</span>
        <span style="min-width:0;flex:1">
          <span class="gr-title" style="display:block">${esc(it.title)}</span>
          <span class="gr-sub" style="display:block">${esc(it.sub || '')}</span>
        </span>
        <span style="color:var(--gray2);font-size:13px">→</span>
      </div>`;
    });
  });
  _gsFlat = flat;
  el.innerHTML = html || `<div class="gr-empty">No matches for “${esc(q)}” in leads, shipments, contacts, invoices or tasks.</div>`;
  el.style.display = 'block';
}

function openGlobalResult(i) {
  const hit = _gsFlat[i]; if (!hit) return;
  hideGlobalResults();
  setActivePage(hit.item.page || hit.page);
  hit.item.open();
}

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('search-wrap');
  if (wrap && !wrap.contains(e.target)) hideGlobalResults();
});

  switch(page) {

    case 'contacts':      renderContacts(); break;
    case 'quote-leads':   renderQuoteLeads(); break;
    case 'shipment-leads':renderShipmentLeads(); break;
    case 'book-shipment':renderBookShipment(); break;
    case 'tasks':         renderTasks(); break;
    case 'invoices':      renderInvoices(); break;
    case 'gst-invoices':  renderGstInvoices(); break;
    case 'users':         renderUsers(); break;
    case 'reports':       renderReports(); break;
    case 'get-rate':      renderGetRate(); break;
  }
}

// ─── SHIPGLOBAL BILLABLE WEIGHT — volumetric (L×W×H/5000) vs actual ────────
function sgDimsFromLead(l) {
  if (!l) return [];
  const out = [];
  const packing = Array.isArray(l.packingList) ? l.packingList : [];
  for (const p of packing) {
    const L = parseFloat(p.length), W = parseFloat(p.width), H = parseFloat(p.height);
    if (L > 0 && W > 0 && H > 0) out.push({ length_cm: L, width_cm: W, height_cm: H, box_count: 1 });
  }
  if (!out.length && l.dimensions) {
    const p = String(l.dimensions).toLowerCase().split('x').map(n => parseFloat(n));
    if (p.length === 3 && p.every(n => n > 0)) out.push({ length_cm: p[0], width_cm: p[1], height_cm: p[2], box_count: 1 });
  }
  return out;
}
function grDimsFromDom() {
  const out = [];
  const lens = document.querySelectorAll('.gr-len'), wids = document.querySelectorAll('.gr-wid'),
        hgts = document.querySelectorAll('.gr-hgt'), qtys = document.querySelectorAll('.gr-qty');
  for (let i = 0; i < lens.length; i++) {
    const L = parseFloat(lens[i].value), W = parseFloat(wids[i]?.value), H = parseFloat(hgts[i]?.value);
    const q = parseInt(qtys[i]?.value) || 1;
    if (L > 0 && W > 0 && H > 0) out.push({ length_cm: L, width_cm: W, height_cm: H, box_count: q });
  }
  return out;
}
function sgChargeableNote(d) {
  if (!d || d.weightBasis !== 'volumetric') return '';
  return `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;font-size:12px;color:#92400e;margin-top:10px">⚖️ Rate on chargeable weight <strong>${d.billableWeight} kg</strong> — volumetric ${d.volumetricWeight} kg (L×W×H/5000) is higher than actual ${d.actualWeight} kg.</div>`;
}

let _qsgServices = [], _qdhRate = 0, _qsgLead = null, _qdhServices = [];
async function getQuoteLeadRates() {

    const pc = l.destinationPincode || extractIntlPostcode(l.destination);

    else showQuoteSgRates(l, { w: w > 0 ? w : '', pc: pc || '', c: country });
    return;
  }
  const pin6 = (s) => { const m = String(s || '').match(/\b\d{6}\b/); return m ? m[0] : ''; };
  const o = l.originPincode || pin6(l.origin);
  const d = l.destinationPincode || pin6(l.destination);
  const missing = [];
  if (!(w > 0)) missing.push('weight');
  if (!o) missing.push('origin pincode');
  if (!d) missing.push('destination pincode');
  if (missing.length) { toast('Please fill ' + missing.join(', ') + ' first', 'error'); return; }
  let dims = [{ length_cm: 50, width_cm: 40, height_cm: 30, box_count: 1 }];
  if (l.dimensions) {
    const p = String(l.dimensions).toLowerCase().split('x').map(n => parseFloat(n));
    if (p.length === 3 && p.every(n => n > 0)) dims = [{ length_cm: p[0], width_cm: p[1], height_cm: p[2], box_count: 1 }];
  }
  toast('Getting Rates', 'info');
  const r = await api('POST', '/api/delhivery/rate', { source_pin: o, consignee_pin: d, weight_g: Math.round(w * 1000), inv_amount: l.estimatedValue || 1000, dimensions: dims, payment_mode: 'prepaid' });
  if (!r) { toast('Session expired. Please log in again.', 'error'); return; }
  if (!r.success) { toast(r.error || 'Failed to get rate', 'error'); return; }
  showQuoteDhResult(r.data, o, d);
}

  if (!s) return '';
  const t = String(s).toLowerCase();
  const alias = { 'uk': 'GB', 'united kingdom': 'GB', 'england': 'GB', 'britain': 'GB', 'usa': 'US', 'united states': 'US', 'america': 'US', 'uae': 'AE', 'emirates': 'AE', 'dubai': 'AE', 'holland': 'NL', 'south korea': 'KR', 'korea': 'KR', 'russia': 'RU', 'turkiye': 'TR', 'czech': 'CZ', 'ivory coast': 'CI' };
  for (const k in alias) { if (t.includes(k)) return alias[k]; }
  if (/^[a-z]{2}$/.test(t)) return t.toUpperCase();
  const entry = SG_COUNTRIES.split(',').find(p => { const n = p.slice(p.indexOf(':') + 1).toLowerCase(); return t.includes(n); });
  return entry ? entry.slice(0, 2) : '';
}
function extractIntlPostcode(s) {
  if (!s) return '';
  const t = String(s);
  const uk = t.match(/\b([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})\b/i);
  if (uk) return uk[1].toUpperCase().replace(/\s+/, ' ');
  const parts = t.split(',').map(p => p.trim()).filter(Boolean);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.length < 3 || p.length > 12 || !/^[A-Za-z0-9][A-Za-z0-9 -]*$/.test(p)) continue;
    const digits = (p.match(/\d/g) || []).length;
    const letters = (p.match(/[A-Za-z]/g) || []).length;
    if (letters > 0 && digits > 0 && p === p.toUpperCase()) return p;
    if (letters === 0 && /^\d{4,8}$/.test(p.replace(/ /g, ''))) return p;
  }
  return '';
}

function grCountryOptions() {

  return `<option value="IN" selected>India (IN)</option>` + rest;
}

// One segment of the Done / Hold / Cancel control. Clicking the active one reverts to Pending.
function taskSegBtn(t, key, status, label, icon) {
  const on = t.status === status;
  return `<button class="${on ? 'is-' + key : ''}" title="${on ? 'Set back to Pending' : 'Mark as ' + label}" onclick="setTaskStatus('${t.id}','${on ? 'pending' : status}',event)">${icon} ${label}</button>`;
}

async function setTaskStatus(id, status, e) {
  e.stopPropagation();
  const r = await api('PATCH', `/api/tasks/${id}`, { status });
  if (!r?.success) { toast(r?.error || 'Could not update task', 'error'); return; }
  toast(TASK_ACT_TOAST[status] || 'Task updated', 'success');
  renderTasks();
}

async function deleteTask(t, e) {
  e.stopPropagation();
  if (!confirm(`Delete "${t.title}"? This cannot be undone.`)) return;
  const r = await api('DELETE', `/api/tasks/${t.id}`);
  if (!r?.success) { toast(r?.error || 'Could not delete task', 'error'); return; }
  toast('Task deleted', 'success');
  renderTasks();
}

function assignDropdown(currentId) {

function dimsBlock(l) {
  const parse = (s) => { if(!s) return ['','','']; const p=s.split('x'); return [p[0]||'',p[1]||'',p[2]||'']; };
  const [dl,dw,dh] = parse(l?.dimensions);
  return `
  <div style="background:var(--gray4);border:1.5px solid var(--gray3);border-radius:10px;padding:14px;margin-bottom:14px">
    <div style="font-size:12px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">📦 Dimensions (cm)</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div class="fg" style="flex:1;margin:0"><label>Length</label><input id="mf-len" type="number" step="0.1" placeholder="L" value="${dl}" oninput="calcDimWeightQ()"/></div>
      <div style="font-size:20px;font-weight:700;color:var(--gray2);margin-top:18px">×</div>
      <div class="fg" style="flex:1;margin:0"><label>Width</label><input id="mf-wid" type="number" step="0.1" placeholder="W" value="${dw}" oninput="calcDimWeightQ()"/></div>
      <div style="font-size:20px;font-weight:700;color:var(--gray2);margin-top:18px">×</div>
      <div class="fg" style="flex:1;margin:0"><label>Height</label><input id="mf-hgt" type="number" step="0.1" placeholder="H" value="${dh}" oninput="calcDimWeightQ()"/></div>
    </div>
    <div class="form-row">
      <div class="fg" style="margin:0"><label>Actual Weight (kg)</label><input id="mf-weight" type="number" step="0.01" value="${l?.weight||''}"/></div>
      <div class="fg" style="margin:0"><label>Dim. Weight (kg)</label><input id="mf-dimweight" type="number" step="0.01" placeholder="Auto" readonly style="background:#f1f5f9;color:var(--gray);cursor:not-allowed"/></div>
    </div>
  </div>`;
}
function calcDimWeightQ() {
  const L = parseFloat(document.getElementById('mf-len')?.value) || 0;
  const W = parseFloat(document.getElementById('mf-wid')?.value) || 0;
  const H = parseFloat(document.getElementById('mf-hgt')?.value) || 0;
  const dw = document.getElementById('mf-dimweight');
  if (!dw) return;
  if (L > 0 && W > 0 && H > 0) {
    dw.value = ((L * W * H) / 5000).toFixed(2);
    dw.style.background = '#fefce8';
  } else { dw.value = ''; dw.style.background = '#f1f5f9'; }
}

function showModal(title, bodyHtml, saveCb) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-foot').innerHTML = '<button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" id="modal-save" onclick="modalSave()">Save</button>';
  document.getElementById('modal-overlay').classList.add('show');
  modalCb = saveCb;
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); modalCb = null; }
// Read-only modal: same shell as showModal but with a single Close action
function showViewModal(title, bodyHtml) {
  showModal(title, bodyHtml, null);
  document.getElementById('modal-foot').innerHTML = '<button class="btn-cancel" onclick="closeModal()">Close</button>';
  modalCb = null;
}
let _modalSaving = false;
function modalSave() {
  // Prevent double-submit: ignore extra clicks while a save is in flight
  if (_modalSaving || !modalCb) return;
  _modalSaving = true;
  const btn = document.getElementById('modal-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  const done = () => { _modalSaving = false; if (btn) { btn.disabled = false; btn.textContent = 'Save'; } };
  try { Promise.resolve(modalCb()).then(done, done); } catch (e) { done(); }
}

// ─── DIMENSIONAL WEIGHT ───────────────────────────────────────────────────────
// Formula: (L × W × H) / 5000  — standard international courier divisor
function calcDimWeight(type) {
  const L = parseFloat(document.getElementById('mf-len')?.value) || 0;
  const W = parseFloat(document.getElementById('mf-wid')?.value) || 0;
  const H = parseFloat(document.getElementById('mf-hgt')?.value) || 0;
  const dw = document.getElementById('mf-dimweight');
  if (!dw) return;
  if (L > 0 && W > 0 && H > 0) {
    dw.value = ((L * W * H) / 5000).toFixed(2);
    dw.style.background = '#fefce8';
  } else {
    dw.value = '';
    dw.style.background = '#f1f5f9';
  }
}

// ─── INVOICES ───────────────────────────────────────────────────────────────
let _invLines = [];
let _invLeadType = null;

function invMoney(n) { if (n == null || isNaN(Number(n))) return '₹0.00'; return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtINVDate(d) { if (!d) return '—'; const dt = new Date(d); if (isNaN(dt.getTime())) return '—'; const p = x => String(x).padStart(2, '0'); return `${p(dt.getDate())}/${p(dt.getMonth() + 1)}/${dt.getFullYear()}`; }
function payBadge(s) { const m = { paid: 'Paid', partial: 'Partial', due: 'Due', cancelled: 'Cancelled' }; return `<span class="badge badge-${s}">${m[s] || esc(s)}</span>`; }
function invBalance(inv) { return Math.max(0, Math.round(((Number(inv.total) || 0) - (Number(inv.amountPaid) || 0)) * 100) / 100); }
function invWords(num) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = n => n < 20 ? ones[n] : (tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : ''));
  const three = n => n >= 100 ? (ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + two(n % 100) : '')) : two(n);
  const inr = n => {
    n = Math.floor(n);
    if (n === 0) return 'Zero';
    let s = '';
    const cr = Math.floor(n / 10000000); n %= 10000000;
    const lk = Math.floor(n / 100000); n %= 100000;
    const th = Math.floor(n / 1000); n %= 1000;
    if (cr) s += three(cr) + ' Crore ';
    if (lk) s += two(lk) + ' Lakh ';
    if (th) s += two(th) + ' Thousand ';
    if (n) s += three(n);
    return s.trim();
  };
  const rupees = Math.floor(num || 0);
  const paise = Math.round(((num || 0) - rupees) * 100);
  let out = 'Indian Rupee ' + inr(rupees);
  if (paise) out += ' and ' + inr(paise) + ' Paise';
  return out + ' Only';
}

  const df = curFilter.dateFrom || '', dt = curFilter.dateTo || '';
  const items = paidAll.filter(inv => {
    if (!df && !dt) return true;
    const d = new Date(inv.invoiceDate);
    if (isNaN(d.getTime())) return false;
    if (df && d < new Date(df + 'T00:00:00')) return false;
    if (dt && d > new Date(dt + 'T23:59:59')) return false;
    return true;
  });
  let sumTax = 0, sumGst = 0, sumTot = 0;
  const rows = items.map(inv => {
    const paid = Math.round(((Number(inv.amountPaid) > 0 ? Number(inv.amountPaid) : Number(inv.total)) || 0) * 100) / 100;
    const ownGst = (Number(inv.cgstAmount) || 0) + (Number(inv.sgstAmount) || 0);

    if (ownGst > 0) {
      taxable = Math.round((paid - ownGst) * 100) / 100;
      gst = Math.round(ownGst * 100) / 100;
    } else {
      taxable = Math.round((paid / 1.18) * 100) / 100;
      gst = Math.round((paid - taxable) * 100) / 100;
    }
    sumTax += taxable; sumGst += gst; sumTot += paid;
    return { inv, paid, taxable, gst };

    ${rows.map(({inv, paid, taxable, gst}) => `<tr onclick="viewInvoice('${inv.id}','gst-invoices')">

function gstSelToggle(id, on) {
  window._gstSel = window._gstSel || new Set();
  if (on) window._gstSel.add(id); else window._gstSel.delete(id);
  const b = document.getElementById('gst-dl-btn');
  if (b) b.textContent = `⬇ Download PDF (${gstSelCount()})`;
}
function gstSelCount() {
  return (window._gstVisibleIds || []).filter(id => window._gstSel && window._gstSel.has(id)).length;
}
function gstSelAll(on) {
  window._gstSel = window._gstSel || new Set();
  (window._gstVisibleIds || []).forEach(id => { if (on) window._gstSel.add(id); else window._gstSel.delete(id); });
  renderGstInvoices();
}
function gstClearDates() { curFilter.dateFrom = ''; curFilter.dateTo = ''; renderGstInvoices(); }
async function gstDownloadPdf() {
  const ids = (window._gstVisibleIds || []).filter(id => window._gstSel && window._gstSel.has(id));
  if (!ids.length) { toast('Select at least one invoice (checkbox)', 'error'); return; }
  if (typeof html2pdf === 'undefined') { toast('PDF library has not loaded yet — check your connection and try again', 'error'); return; }
  const btn = document.getElementById('gst-dl-btn');
  if (btn) btn.disabled = true;
  for (let i = 0; i < ids.length; i++) {
    if (btn) btn.innerHTML = `⏳ ${i + 1}/${ids.length}…`;
    try {
      const rr = await api('GET', `/api/invoices/${ids[i]}`);
      const inv = rr?.data;
      if (inv) await gstPdfOne(inv);
    } catch (e) { console.error('[GST PDF]', e); }
  }
  if (btn) { btn.disabled = false; btn.innerHTML = `⬇ Download PDF (${gstSelCount()})`; }
  toast(`GST invoice PDF${ids.length > 1 ? 's' : ''} downloaded`, 'success');
}
async function gstPdfOne(inv) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-15000px;top:0;width:760px;background:#fff;z-index:-1';
  wrap.innerHTML = invDetailMain(inv, true);
  document.body.appendChild(wrap);
  try {
    await Promise.all(Array.from(wrap.querySelectorAll('img')).map(im => im.complete ? Promise.resolve() : new Promise(res => { im.onload = res; im.onerror = res; })));
    const el = wrap.querySelector('.invoice-page');
    const filename = String(inv.invoiceNo || 'invoice').replace(/[\\/:*?"<>|]/g, '-') + '.pdf';
    await html2pdf().set({
      margin: [6, 8],
      filename,
      image: { type: 'jpeg', quality: 1 },
      html2canvas: { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] },
    }).from(el).save();
  } finally { wrap.remove(); }
}

  const dueSub = (inv.terms === 'Due on Receipt') ? 'Payable Immediately' : 'Payable by ' + fmtINVDate(inv.dueDate);
  const gstOwnRate = (Number(inv.cgstRate) || 0) + (Number(inv.sgstRate) || 0);
  const gstOwnAmt = (Number(inv.cgstAmount) || 0) + (Number(inv.sgstAmount) || 0);
  let gstRate = 0, gstAmt = 0, gsub = Number(inv.subtotal) || 0, gitems = items;
  if (gstOwnRate > 0 || gstOwnAmt > 0) {
    gstRate = gstOwnRate;
    gstAmt = Math.round(gstOwnAmt * 100) / 100;
  } else if (gstMode && inv.paymentStatus === 'paid') {
    const tot = Math.round((Number(inv.total) || 0) * 100) / 100;
    gstRate = 18;
    gsub = Math.round((tot / 1.18) * 100) / 100;
    gstAmt = Math.round((tot - gsub) * 100) / 100;
    const sumItems = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.rate) || 0), 0);

          : Math.round((amt / sumItems * gsub) * 100) / 100;

function openInvoiceModal(inv, prefill) {

    ? inv.items.map(i => ({ description: i.description || '', details: i.details || '', qty: i.qty ?? 1, rate: i.rate ?? '' }))
    : (Array.isArray(prefill.items) && prefill.items.length)
      ? prefill.items.map(i => ({ description: i.description || '', details: i.details || '', qty: i.qty ?? 1, rate: i.rate ?? '' }))
      : [{ description: '', details: '', qty: 1, rate: '' }];
  const today = new Date().toISOString().slice(0, 10);

  showModal(inv ? `Edit Invoice ${inv.invoiceNo}` : 'New Invoice', `

    <div class="fg"><label>Sender Name *</label><input id="inv-customer" value="${esc(inv?.customerName || prefill.customerName || '')}"/></div>
    <div class="fg"><label>Sender Mobile Number</label><input id="inv-sphone" value="${esc(inv?.senderPhone || prefill.senderPhone || '')}"/></div>

    const body = {
      invoiceDate: document.getElementById('inv-date').value || today,
      dueDate: document.getElementById('inv-duedate').value || null,
      terms: document.getElementById('inv-terms').value,
      placeOfSupply: document.getElementById('inv-pos').value,

      customerAddress: document.getElementById('inv-address').value,
      senderPhone: document.getElementById('inv-sphone').value,
      receiverName: document.getElementById('inv-rname').value,

      serviceDesc: document.getElementById('inv-service').value,
      items: items.map(l => ({ description: l.description.trim(), details: (l.details || '').trim(), qty: Number(l.qty) || 1, rate: Number(l.rate) || 0 })),
      cgstRate: Number(document.getElementById('inv-gst').value) || 0,
      sgstRate: 0,
      amountPaid: Number(document.getElementById('inv-paid').value) || 0,
      notes: document.getElementById('inv-notes').value,
      sourceLeadId: (leadId && leadId !== '—') ? leadId : null,
      sourceLeadType: (leadId && leadId !== '—') ? (_invLeadType || inv?.sourceLeadType || null) : null,
    };
    const r = inv ? await api('PATCH', `/api/invoices/${inv.id}`, body) : await api('POST', '/api/invoices', body);
    if (!r?.success) { toast(r?.error || 'Error saving invoice', 'error'); return; }
    toast(inv ? 'Invoice updated' : 'Invoice created', 'success');
    closeModal();
    viewInvoice(r.data.id, (curPage === 'gst-invoices' || curPage === 'invoices') ? curPage : 'invoices');
  });
  invLinesRender();
  invCalcTotals();
  if (!inv) invTermsChange(curTerms);

function invLineAdd() { _invLines.push({ description: '', details: '', qty: 1, rate: '' }); invLinesRender(); invCalcTotals(); }

function invCalcTotals() {

  el.innerHTML = `

async function invLookupLead() {

  if (type === 'shipment-leads') {
    setVal('inv-rname', data.receiverName);
    setVal('inv-rphone', data.receiverPhone);

    if (daddr) setVal('inv-raddr', daddr);
    setVal('inv-waybill', data.awbNumber || data.bookingRef);

const NOTE_API = { contact: '/api/contacts', quote: '/api/quote-leads', shipment: '/api/shipment-leads', task: '/api/tasks' };
function parseNotes(raw) {
  if (!raw) return [];
  const t = String(raw).trim(); if (!t) return [];
  if (t.startsWith('[')) {
    try {
      const arr = JSON.parse(t);
      if (Array.isArray(arr)) {
        if (arr.length === 0) return [];
        const items = arr.filter(n => n && typeof n.text === 'string' && n.text.trim())
          .map(n => ({ id: (typeof n.id === 'string' && n.id) ? n.id : 'n' + Math.random().toString(36).slice(2,10), text: String(n.text), by: (typeof n.by === 'string' && n.by) ? n.by : null, at: (typeof n.at === 'string' && n.at) ? n.at : null }));
        if (items.length) return items;
      }
    } catch (e) {}
  }
  return [{ id: 'legacy', text: t, by: null, at: null }];
}
function notesHtml(type, id, raw, ctx, ro) {
  ctx = ctx || 'd';
  ro = !!ro;
  const notes = parseNotes(raw);
  return `<div class="notes-block" data-ro="${ro ? '1' : '0'}" id="notes-${type}-${id}-${ctx}">
    <div class="notes-head"><div class="notes-label">📝 Notes (${notes.length})</div>
      ${ro ? '' : `<button type="button" class="btn-note-add" onclick="noteEditorToggle('${type}','${id}','${ctx}')">+ Add Note</button>`}</div>
    <div class="notes-list">${notes.length ? notes.map(n => `
      <div class="note-item"><div class="note-meta">${esc(n.by || '—')}${n.at ? ' · ' + fmtDT(n.at) : ''}</div>
        <div class="note-text">${esc(n.text)}</div>
        ${ro ? '' : `<button type="button" class="note-del" title="Delete note" onclick="deleteNote('${type}','${id}','${n.id}','${ctx}')">✕</button>`}</div>`).join('')
      : `<div style="font-size:12.5px;color:var(--gray2);padding:2px 0">${ro ? 'No notes yet.' : 'No notes yet — click "+ Add Note" to write one.'}</div>`}</div>
    ${ro ? '' : `<div class="note-editor" id="note-ed-${type}-${id}-${ctx}" style="display:none">
      <textarea id="note-ta-${type}-${id}-${ctx}" placeholder="Write a note..."></textarea>
      <div class="note-editor-actions">
        <button type="button" class="btn-cancel" onclick="noteEditorHide('${type}','${id}','${ctx}')">Cancel</button>
        <button type="button" class="btn-save" onclick="saveNote('${type}','${id}','${ctx}')">Save Note</button>
      </div>
    </div>`}
  </div>`;
}
function noteEditorToggle(type, id, ctx) {
  const ed = document.getElementById(`note-ed-${type}-${id}-${ctx}`); if (!ed) return;
  const show = ed.style.display === 'none';
  ed.style.display = show ? '' : 'none';
  if (show) { const ta = document.getElementById(`note-ta-${type}-${id}-${ctx}`); if (ta) ta.focus(); }
}
function noteEditorHide(type, id, ctx) { const ed = document.getElementById(`note-ed-${type}-${id}-${ctx}`); if (ed) ed.style.display = 'none'; }
function refreshNotes(type, id, ctx, raw) {
  // refresh the calling context and the other one (detail ↔ modal) so nothing goes stale
  ['d','m'].forEach(c => {
    const wrap = document.getElementById(`notes-${type}-${id}-${c}`); if (!wrap) return;
    const ro = wrap.dataset.ro === '1';
    const tmp = document.createElement('div'); tmp.innerHTML = notesHtml(type, id, raw, c, ro);
    wrap.replaceWith(tmp.firstElementChild);
  });
}
async function saveNote(type, id, ctx) {
  const ta = document.getElementById(`note-ta-${type}-${id}-${ctx}`);
  const text = (ta && ta.value || '').trim();
  if (!text) { toast('Note cannot be empty', 'error'); return; }
  const r = await api('PATCH', `${NOTE_API[type]}/${id}`, { addNote: text });
  if (!r?.success) { toast(r?.error || 'Error adding note', 'error'); return; }
  refreshNotes(type, id, ctx, r.data?.notes);
  toast('Note added', 'success');
}
async function deleteNote(type, id, noteId, ctx) {

  const r = await api('PATCH', `${NOTE_API[type]}/${id}`, { deleteNoteId: noteId });
  if (!r?.success) { toast(r?.error || 'Error deleting note', 'error'); return; }
  refreshNotes(type, id, ctx, r.data?.notes);
  toast('Note deleted', 'success');
}
function badge(s) { return `<span class="badge badge-${s}">${fmtStatus(s)}</span>`; }
function fmtStatus(s) {
  const map = {
    prospect:'Prospect', qualified:'Qualified', hot_lead:'Hot Lead', negotiation:'Negotiation', won:'Won', lost:'Lost', cold:'Cold',
    new_inquiry:'New Inquiry', quoted:'Quoted', follow_up:'Follow Up', shipment_booked:'Shipment Booked', delivered:'Delivered', cancelled:'Cancelled',
    pending:'Pending', in_progress:'In Progress', completed:'Completed', overdue:'Overdue', on_hold:'On Hold',
    high:'High', medium:'Medium', low:'Low',
    air:'Air', sea:'Sea', road:'Road', courier:'Courier',
  };
  return map[s] || s?.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) || s;
}
function roleLabel(r) { return {admin:'Admin',manager:'Manager',sales_rep:'Sales Rep'}[r]||r; }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtCur(v) { if (!v && v!==0) return '—'; const n = Number(v); if (isNaN(n)) return '—'; return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:0}); }
function emptyState(icon, title, sub) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div><div class="empty-sub">${sub}</div></div>`;

// Tracking Management Modal
let _trackId = null;
let _trackTimeline = [];
let _trackLeadId = null;
let _trackLeadType = null;
let _trackFromList = false;

function openTrackingModal(trackId, timeline, leadId, leadType, fromList) {
  _trackId = trackId;
  _trackTimeline = Array.isArray(timeline) ? [...timeline] : [];
  _trackLeadId = leadId;
  _trackLeadType = leadType;
  _trackFromList = !!fromList;
  renderTrackingModal();
}

function renderTrackingModal() {
  const tlHtml = _trackTimeline.length
    ? _trackTimeline.map((s,i) => `
      <div class="tracking-tl-item" style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1">
          <div class="tl-status">${esc(s.status || s.status_text || '')}</div>
          ${s.location ? `<div class="tl-loc">📍 ${esc(s.location)}</div>` : ''}
          <div class="tl-date">${fmtDate(s.timestamp || s.status_date)}</div>
        </div>
        <button class="tl-del" onclick="deleteTrackingEntry(${i})" title="Delete">✕</button>
      </div>`).join('')
    : '<div style="text-align:center;padding:20px;color:var(--gray2);font-size:13px">No tracking entries yet. Add one below.</div>';

  document.getElementById('modal-title').textContent = 'Manage Tracking';
  document.getElementById('modal-body').innerHTML = `
    <div class="tracking-tl" style="margin-bottom:20px">${tlHtml}</div>
    <div style="border-top:1px solid var(--gray3);padding-top:16px">
      <div style="font-size:13px;font-weight:700;color:var(--gray);margin-bottom:10px">Add Status Entry</div>
      <div class="fg"><label>Status Text *</label><input id="tl-status-text" placeholder="e.g. Picked Up, In Transit, Out for Delivery, Delivered"/></div>
      <div class="fg"><label>Location</label><input id="tl-location" placeholder="e.g. Mumbai, Delhi Hub"/></div>
      <div class="fg"><label>Date & Time</label><input id="tl-date" type="datetime-local"/></div>
      <button class="btn-save" style="width:100%;margin-top:8px" onclick="addTrackingEntry()">➕ Add Entry</button>
    </div>`;
  document.getElementById('modal-foot').innerHTML = '<button class="btn-cancel" onclick="closeTrackingAndRefresh()">Done</button>';
  document.getElementById('modal-overlay').classList.add('show');
}

function closeTrackingAndRefresh() {
  const fromList = _trackFromList; _trackFromList = false;
  closeModal();
  if (_trackLeadId && _trackLeadType) {
    invalidateCache('/api/tracking/');
    if (fromList) renderPage(curPage); // opened from a list row — stay on the list
    else if (_trackLeadType === 'quote') viewQuoteLead(_trackLeadId);
    else if (_trackLeadType === 'book') showBookShipmentDetail(_trackLeadId);
    else if (_trackLeadType === 'shipment') viewShipmentLead(_trackLeadId);
  }
}

async function addTrackingEntry() {
  const statusText = document.getElementById('tl-status-text')?.value?.trim();
  if (!statusText) { toast('Status text is required', 'error'); return; }
  const location = document.getElementById('tl-location')?.value?.trim() || null;
  const statusDate = document.getElementById('tl-date')?.value || null;

  const r = await api('POST', `/api/tracking/${_trackId}/statuses`, {
    status_text: statusText, location, status_date: statusDate ? new Date(statusDate).toISOString() : undefined,
  });
  if (!r?.success) { toast(r?.error || 'Error adding status', 'error'); return; }

  _trackTimeline.push({ id: r.data.id, status: statusText, location, timestamp: r.data.timestamp });
  toast('Status added!', 'success');
  document.getElementById('tl-status-text').value = '';
  document.getElementById('tl-location').value = '';
  document.getElementById('tl-date').value = '';
  renderTrackingModal();
}

async function deleteTrackingEntry(idx) {
  const entry = _trackTimeline[idx];
  if (!entry) return;
  if (!confirm('Delete this status entry?')) return;
  const key = entry.id ?? idx;
  try {
    const r = await api('DELETE', `/api/tracking/${_trackId}/statuses/${key}`);
    if (!r?.success) { toast(r?.error || 'Error deleting entry', 'error'); return; }
    _trackTimeline.splice(idx, 1);
    toast('Status deleted', 'success');
    renderTrackingModal();
  } catch (e) {
    toast('Could not delete entry', 'error');
  }
}

function _parseAddress(s) {
  if (!s) return { city:'', state:'', pin:'', country:'', addr:'' };
  const pinM = s.match(/\b(\d{6})\b/);
  const pin = pinM ? pinM[1] : '';
  const parts = s.split(',').map(p => p.trim()).filter(Boolean);
  let city = '', state = '', country = '', addr = '';
  for (const p of parts) {
    if (/^\d{6}$/.test(p)) continue;
    if (/^(india|uae|usa|uk|singapore|german|france|australia|canada|japan|china)$/i.test(p)) { country = p; continue; }
    if (/^(gujarat|maharashtra|delhi|karnataka|tamil|rajasthan|uttar|madhya|west bengal|andhra|telangana|kerala|punjab|haryana|odisha|assam|jharkhand|chhattisgarh|goa|himachal|jammu|meghalaya|manipur|nagaland|tripura|mizoram|arunachal|sikkim|manipur|ukharakhand)$/i.test(p)) { state = p; continue; }
  }
  if (parts.length >= 2) { city = parts[parts.length > 3 ? 3 : 0] || ''; }
  if (!city && parts.length > 0) city = parts[0] || '';
  if (!state) { for (const p of parts) { if (p.length > 3 && !/^\d/.test(p) && !/^(india|air|sea|road|courier)/i.test(p)) { state = p; break; } } }
  addr = parts.filter(p => p !== city && p !== state && p !== country && !/^\d{6}$/.test(p)).slice(0, 2).join(', ');
  return { city: city || '', state: state || '', pin, country: country || 'India', addr };
}

async function renderBookShipment() {

  if (curFilter.shipmentType) url += `&shipmentType=${curFilter.shipmentType}`;
  if (curFilter.assignedToId) url += `&assignedToId=${curFilter.assignedToId}`;
  if (curFilter.dateFrom)     url += `&dateFrom=${curFilter.dateFrom}`;
  if (curFilter.dateTo)       url += `&dateTo=${curFilter.dateTo}`;

    </div>`;

    + '<td style="padding:4px"><button type="button" onclick="removePackingRow(this)" style="background:none;color:var(--gray2);font-size:14px;padding:2px 4px;border-radius:4px" onmouseover="this.style.color=\'#dc2626\';this.style.background=\'#fee2e2\'" onmouseout="this.style.color=\'var(--gray2)\';this.style.background=\'none\'">&times;</button></td>';

function removePackingRow(btn) {
  const tr = btn.closest('tr');
  if (tr) { tr.remove(); calcPackingGrand(); }
}
function calcPackingVol(input) {
  const tr = input.closest('tr');
  const l=parseFloat(tr.querySelector('[data-col="length"]').value)||0;
  const w=parseFloat(tr.querySelector('[data-col="width"]').value)||0;
  const h=parseFloat(tr.querySelector('[data-col="height"]').value)||0;
  const unit=(tr.querySelector('[data-col="unit"]').value||'cm').toLowerCase();
  if(l&&w&&h){
    let lcm=l, wcm=h, hcm=h;
    if(unit==='inch'){lcm=l*2.54;wcm=w*2.54;hcm=h*2.54;}
    else if(unit==='mm'){lcm=l/10;wcm=w/10;hcm=h/10;}
    else if(unit==='m'){lcm=l*100;wcm=w*100;hcm=h*100;}
    else if(unit==='ft'){lcm=l*30.48;wcm=w*30.48;hcm=h*30.48;}
    tr.querySelector('[data-col="volweight"]').value=(lcm*wcm*hcm/5000).toFixed(2);
  } else {
    tr.querySelector('[data-col="volweight"]').value='';
  }
  calcPackingTotal(input);
}
function calcPackingTotal(input) {
  const tr = input.closest('tr');
  const qty=parseFloat(tr.querySelector('[data-col="qty"]').value)||0;
  const valStr=tr.querySelector('[data-col="value"]').value||'';
  const val=valStr.split(',').map(s=>parseFloat(s.trim())||0).reduce((a,b)=>a+b,0);
  tr.querySelector('[data-col="total"]').value = (qty*val).toFixed(2);
  calcPackingGrand();
}
function calcPackingGrand() {
  let total=0;
  document.querySelectorAll('#mf-packing-body tr').forEach(tr=>{
    total += parseFloat(tr.querySelector('[data-col="total"]')?.value)||0;
  });
  const el = document.getElementById('mf-packing-grand');
  if (el) el.textContent = total.toFixed(2);
}

async function lookupLead() {
  const val = document.getElementById('mf-lookup').value.trim();
  const el = document.getElementById('lookup-result');
  if (!val) { el.innerHTML = '<span style="color:var(--red)">Please enter a Lead ID</span>'; return; }
  el.innerHTML = '<span style="color:var(--gray)">Looking up...</span>';

  let data = null;
  for (const type of ['shipment-leads', 'quote-leads', 'contacts']) {
    const r = await api('GET', `/api/${type}?search=${encodeURIComponent(val)}&limit=5`);
    const items = Array.isArray(r?.data) ? r.data : [];
    if (items.length > 0) { data = items[0]; break; }
  }

  if (!data) { el.innerHTML = '<span style="color:var(--red)">Lead not found</span>'; return; }

  // Sales rep must not load details of a record assigned to someone else
  if (rowLocked(data)) {
    el.innerHTML = `<span style="color:#dc2626">🔒 Assigned to <strong>${esc(data.assignedTo?.name || 'another user')}</strong> — you do not have access to this record</span>`;
    return;
  }

  const setVal = (id, v) => { const e = document.getElementById(id); if (e) e.value = v || ''; };
  setVal('mf-name', data.customerName || data.name);
  setVal('mf-company', data.company);
  setVal('mf-email', data.email);
  setVal('mf-phone', data.phone);
  setVal('mf-weight', data.weight);
  setVal('mf-declvalue', data.declaredValue || data.estimatedValue);

  const oAddr = _parseAddress(data.origin);
  setVal('mf-o-city', oAddr.city);
  setVal('mf-o-pin', oAddr.pin);
  setVal('mf-o-state', oAddr.state);
  setVal('mf-o-country', oAddr.country);
  setVal('mf-o-address1', data.address1);

  const dAddr = _parseAddress(data.destination);
  setVal('mf-d-city', dAddr.city);
  setVal('mf-d-pin', dAddr.pin);
  setVal('mf-d-state', dAddr.state);
  setVal('mf-d-country', dAddr.country);

  if (data.dimensions) {
    const p = data.dimensions.split('x');
    setVal('mf-len', p[0]); setVal('mf-wid', p[1]); setVal('mf-hgt', p[2]);
    calcDimWeight('b');
  }
  el.innerHTML = `<span style="color:var(--green)">✓ Loaded from <strong>${esc(data.leadId)}</strong> (${esc(data.customerName || data.name)})</span>`;
}

let _bkTrackLead = null;

function humanizeTl(s) { return String(s || '').replace(/_/g, ' ').replace(/\b[a-z]/g, c => c.toUpperCase()); }

function trackStatusChip(status) {
  const s = String(status || 'booked').toLowerCase();
  let bg = '#f3f4f6', fg = '#374151', bd = '#d1d5db';
  if (s.includes('undeliver') || s.includes('rto') || s.includes('exception') || s.includes('cancel')) { bg = '#fee2e2'; fg = '#b91c1c'; bd = '#fecaca'; }
  else if (s.includes('out for')) { bg = '#ffedd5'; fg = '#c2410c'; bd = '#fdba74'; }
  else if (s.includes('deliver')) { bg = '#d1fae5'; fg = '#047857'; bd = '#6ee7b7'; }
  else if (s.includes('picked')) { bg = '#e0e7ff'; fg = '#4338ca'; bd = '#a5b4fc'; }
  else if (s.includes('transit')) { bg = '#dbeafe'; fg = '#1d4ed8'; bd = '#93c5fd'; }
  return `<span style="display:inline-block;background:${bg};color:${fg};border:1px solid ${bd};border-radius:99px;padding:2px 10px;font-size:11px;font-weight:800;margin-left:8px">${esc(humanizeTl(s))}</span>`;
}

function bkTimelineItems(tl) {
  if (!tl || !tl.length) return `<div style="font-size:13px;color:var(--gray2);text-align:center;padding:10px">No tracking events yet.</div>`;
  return `<div class="tracking-tl" style="margin-top:12px">${tl.map(s => {
    const st = s.status || s.status_text || '';
    const note = s.note || '';
    return `<div class="tracking-tl-item"><div class="tl-status">${esc(humanizeTl(st))}</div>${s.location ? `<div class="tl-loc">📍 ${esc(s.location)}</div>` : ''}<div class="tl-date">${fmtDate(s.timestamp || s.status_date)}</div>${note && humanizeTl(note) !== humanizeTl(st) ? `<div class="tl-date">${esc(note)}</div>` : ''}</div>`;
  }).join('')}</div>`;
}

function bkTrackCard(l, t) {
  const rawCarrier = (l.delhiveryLr || l.delhiveryAwb) ? 'Delhivery' : (l.awbNumber ? 'ShipGlobal' : '');
  const carrier = rawCarrier ? (isAdmin() ? rawCarrier : vendorCodeName(rawCarrier, '')) : '';
  const head = `<div style="padding:10px 14px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#2563eb;background:#2563eb11;border-bottom:2px solid #2563eb33">📡 Tracking${carrier ? ' — ' + carrier : ' — Manual'}</div>`;
  if (!t) {

      <div style="padding:14px;font-size:13px;color:var(--gray)">Tracking number status ko <strong>shipment_booked</strong> par set karte hi generate hoga (jaise other screens me). ${carrier ? `Ye shipment <strong>${carrier}</strong> API se book hua hai — status book hote hi timeline auto-sync chalu ho jayegi.` : 'Local vendor booking — events yahan manually add kar sakte hain.'}</div></div>`;
  }
  const tl = Array.isArray(t.timeline) ? t.timeline : [];
  const last = tl[tl.length - 1];
  const status = (last && (last.status || last.status_text)) || t.currentStatus || 'booked';
  return `<div style="background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden">${head}
    <div style="padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div><span style="font-family:monospace;font-size:14px;font-weight:800;color:#15803d">${esc(t.trackingId)}</span>${trackStatusChip(status)}</div>
        <div style="display:flex;gap:6px">
          ${carrier ? `<button class="btn-track" id="bk-sync-btn" onclick="syncLeadTracking('${l.id}',{wrapId:'bk-track-wrap'})">🔄 Refresh</button>` : ''}
          <button class="btn-tracking" onclick="openTrackingModal('${t.id}',${JSON.stringify(tl).replace(/"/g, '&quot;')},'${l.id}','book')">📦 Manage Tracking</button>
        </div>
      </div>
      <div id="bk-track-err" style="font-size:11.5px;color:#b91c1c;margin-top:6px"></div>
      ${bkTimelineItems(tl)}
      <div style="font-size:11px;color:var(--gray2);margin-top:8px">${carrier ? `Vendor API se auto-sync (detail kholte hi + 🔄 Refresh) — live ${carrier} scans.` : 'Manual tracking — events Manage Tracking se add karein.'} Pipeline status hamesha manually badlein.</div>
    </div></div>`;
}

function vsTrackHtml(t) {
  const tl = t && Array.isArray(t.timeline) ? t.timeline : [];
  if (!tl.length) return '';
  return `<div style="margin-top:20px"><div class="section-title">Tracking Timeline</div>${bkTimelineItems(tl)}</div>`;
}

async function syncLeadTracking(leadId, opts = {}) {
  const btn = document.getElementById('bk-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing…'; }
  const r = await api('POST', `/api/tracking/${leadId}/sync`);
  if (btn) { btn.disabled = false; btn.textContent = '🔄 Refresh'; }
  if (!r) return;
  const errEl = document.getElementById('bk-track-err');
  if (!r.success) {
    if (errEl) errEl.textContent = r.error || 'Sync failed';
    if (!opts.silent) toast(r.error || 'Sync failed', 'error');
    return;
  }
  if (errEl) errEl.textContent = '';
  const wrap = document.getElementById(opts.wrapId || 'bk-track-wrap');
  if (wrap) {
    if (opts.wrapId === 'vs-track-wrap') wrap.innerHTML = vsTrackHtml(r.data);
    else wrap.innerHTML = bkTrackCard(_bkTrackLead, r.data);
  }
  if (!opts.silent) toast(r.data.changed ? '✅ Tracking updated' : 'ℹ️ No new updates', r.data.changed ? 'success' : 'info');
}

function copyTrackingId(id) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(id).then(() => toast(`Tracking ID copied: ${id}`, 'success')).catch(() => toast('Could not copy — ' + id, 'error'));
  } else {
    toast('Tracking ID: ' + id, 'info');
  }
}

let _sgBook = null, _sgLastLabel = null;

async function openSgBooking(id) {
  const r = await api('GET', `/api/shipment-leads/${id}`);
  if (!r?.success) { toast('Lead not found', 'error'); return; }
  const l = r.data;
  const w = parseFloat(l.weight);
  const dest = String(l.destination || '');
  const pc = extractIntlPostcode(dest);
  const country = guessCountry(dest);
  const email = l.receiverEmail || l.email || '';
  const phone = l.receiverPhone || l.phone || '';
  const rname = l.receiverName || l.customerName || '';
  const missing = [];
  if (!(w > 0)) missing.push('weight');
  if (!pc) missing.push('destination postcode');
  if (!country || country === 'IN') missing.push('destination country');
  if (!rname) missing.push('receiver name');
  if (!phone) missing.push('receiver phone');
  if (!email) missing.push('email');
  if (missing.length) { toast('Please fill ' + missing.join(', ') + ' first', 'error'); return; }

  toast('Getting Rates', 'info');
  const rr = await api('POST', '/api/shipglobal/rate', { package_weight: w, country_iso_code_2: country, postcode: pc, dimensions: sgDimsFromLead(l) });
  const services = (rr?.success && rr.data?.services) || [];
  const chargeable = rr?.success && rr.data?.weightBasis === 'volumetric' ? rr.data.billableWeight : w;
  _sgBook = { l, w, pc, country, services };

  let defIdx = -1;
  if (services.length) {
    defIdx = services.reduce((bi, s, i, a) => (Number(s.finalRate) < Number(a[bi].finalRate) ? i : bi), 0);
    if (l.selectedService) { const m = services.findIndex(s => s.title === l.selectedService); if (m >= 0) defIdx = m; }
    else if (l.freightCharge) { const m = services.findIndex(s => Number(s.finalRate) === Number(l.freightCharge)); if (m >= 0) defIdx = m; }
  }
  const svcHtml = services.length
    ? `<select id="sgbk-service">${services.map((s, i) => `<option value="${esc(s.title)}" ${i === defIdx ? 'selected' : ''}>${esc(svcNamePlain(s.title, 'shipglobal'))} — ₹${Number(s.finalRate).toLocaleString('en-IN')}${s.transitTime ? ' · ' + esc(s.transitTime) : ''}</option>`).join('')}</select>`
    : `<input id="sgbk-service" placeholder="e.g. Shipglobal Direct" value=""/>`;

  const invNo = l.leadId || ('INV-' + Date.now());
  const today = new Date().toISOString().slice(0, 10);
  const dimsTxt = (() => {
    const p0 = Array.isArray(l.packingList) && l.packingList.length ? l.packingList[0] : null;
    if (p0) return `${p0.length || 50}×${p0.width || 40}×${p0.height || 30} cm`;

  })();

  showModal('🚚 Book on YNCSG', `
    <div style="background:var(--gray4);border:1px solid var(--gray3);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--gray);margin-bottom:12px">
      <div style="font-weight:700;color:var(--black);margin-bottom:4px">📦 ${esc(rname)} → ${esc(dest)}</div>
      Weight <strong>${w} kg</strong>${chargeable !== w ? ` → Chargeable <strong>${chargeable} kg</strong>` : ''} · Dims <strong>${esc(dimsTxt)}</strong> · Postcode <strong>${esc(pc)}</strong> · Country <strong>${esc(country)}</strong><br/>
      Order + label will be created directly — no manual booking needed.
    </div>
    <div class="fg"><label>Service *</label>${svcHtml}</div>
    <div class="form-row">
      <div class="fg"><label>Invoice No *</label><input id="sgbk-inv" value="${esc(invNo)}"/></div>
      <div class="fg"><label>Invoice Date *</label><input id="sgbk-invdate" type="date" value="${today}"/></div>
    </div>
    <button class="btn-primary" id="sgbk-btn" onclick="executeSgBooking()" style="width:100%;margin-top:12px">🚚 Book Shipment</button>
    <div id="sgbk-msg" style="margin-top:10px;font-size:12.5px;text-align:center"></div>

async function executeSgBooking() {
  if (!_sgBook) return;
  const { l, w, pc, country } = _sgBook;
  const svcEl = document.getElementById('sgbk-service');
  const service = svcEl?.tagName === 'SELECT' ? svcEl.value : (svcEl?.value || '').trim();

  if (!invNo || !invDate) { toast('Invoice number and date are required', 'error'); return; }

  const dest = String(l.destination || '');
  const parts = dest.split(',').map(s => s.trim()).filter(Boolean);
  const countryName = (SG_COUNTRIES.split(',').find(p => p.startsWith(country + ':')) || '').slice(3).toLowerCase();
  const rest = parts.filter(p => p.toLowerCase() !== countryName && p !== pc);
  let city = '', state = '', address = dest;
  if (rest.length >= 3) { address = rest.slice(0, -2).join(', '); city = rest[rest.length - 2]; state = rest[rest.length - 1]; }
  else if (rest.length === 2) { address = rest[0]; city = rest[1]; state = rest[1]; }
  else if (rest.length === 1) { address = rest[0]; city = rest[0]; state = rest[0]; }

  const nm = String(l.receiverName || l.customerName || '').trim().split(/\s+/).filter(Boolean);
  const firstname = nm[0] || '';
  const lastname = nm.slice(1).join(' ') || firstname;

  const phone = String(l.receiverPhone || l.phone || '');

  let items = packing.map((p, i) => {
    const qty = parseInt(p.qty) || 1;
    const total = parseFloat(p.total) || parseFloat(p.declaredValue) || 0;
    return {
      vendor_order_item_name: p.description || l.cargoType || `Item ${i + 1}`,
      vendor_order_item_sku: '',
      vendor_order_item_quantity: String(qty),
      vendor_order_item_unit_price: String(total > 0 ? +(total / qty).toFixed(2) : 1),
      vendor_order_item_hsn: '0000',
      vendor_order_item_tax_rate: '0',
    };
  });
  if (!items.length) {
    const qty = l.numberOfPackages || 1;
