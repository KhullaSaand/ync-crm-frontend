    items = [{ vendor_order_item_name: l.cargoType || 'Parcel', vendor_order_item_sku: '', vendor_order_item_quantity: String(qty), vendor_order_item_unit_price: String(+(val / qty).toFixed(2)), vendor_order_item_hsn: '0000', vendor_order_item_tax_rate: '0' }];
  }

  let L = 50, B = 40, H = 30;
  if (packing.length) {
    L = parseFloat(packing[0].length) || L; B = parseFloat(packing[0].width) || B; H = parseFloat(packing[0].height) || H;
  } else if (l.dimensions) {
    const p = String(l.dimensions).toLowerCase().split('x').map(n => parseFloat(n));
    if (p.length === 3 && p.every(n => n > 0)) { L = p[0]; B = p[1]; H = p[2]; }
  }

  const supported = ['AED', 'AUD', 'CAD', 'EUR', 'GBP', 'INR', 'SAR', 'USD'];
  const currency = supported.includes(String(l.currency || '').toUpperCase()) ? String(l.currency).toUpperCase() : 'INR';

  const payload = {
    invoice_no: invNo,
    invoice_date: invDate,
    order_reference: l.leadId || invNo,
    service,
    package_weight: String(w),
    package_length: String(L),
    package_breadth: String(B),
    package_height: String(H),
    currency_code: currency,
    csb5_status: 1,
    customer_shipping_firstname: firstname,
    customer_shipping_lastname: lastname,
    customer_shipping_mobile: phone,
    customer_shipping_email: email,
    customer_shipping_company: l.company || '',
    customer_shipping_address: address,
    customer_shipping_address_2: '',
    customer_shipping_address_3: '',
    customer_shipping_city: city,
    customer_shipping_postcode: pc,
    customer_shipping_country_code: country,
    customer_shipping_state: state,
    ioss_number: '',
    customer_nickname: '',
    vendor_order_items: items,
  };

  const btn = document.getElementById('sgbk-btn');
  const msg = document.getElementById('sgbk-msg');
  if (btn) { btn.disabled = true; btn.textContent = isAdmin() ? 'Booking with ShipGlobal...' : 'Booking shipment...'; }
  if (msg) msg.innerHTML = `<span style="color:var(--gray)">⏳ Creating order + label${isAdmin() ? ' on ShipGlobal' : ''}…</span>`;

  const r = await api('POST', '/api/shipglobal/order', payload);

  if (btn) { btn.disabled = false; btn.textContent = isAdmin() ? '🚚 Book on ShipGlobal' : '🚚 Book Shipment'; }
  if (!r) { if (msg) msg.innerHTML = ''; toast('Session expired. Please log in again.', 'error'); return; }
  if (!r.success) {
    if (msg) msg.innerHTML = `<span style="color:var(--red)">${esc(r.error || 'Booking failed')}</span>`;
    toast(r.error || 'Booking failed', 'error');
    return;
  }

  const tracking = r.data?.tracking || '';
  if (tracking) await api('PATCH', `/api/shipment-leads/${l.id}`, { awbNumber: tracking });
  _sgLastLabel = r.data?.label || null;
  showSgBookedModal(l.id, tracking);
}

function showSgBookedModal(id, tracking) {
  showModal(isAdmin() ? '✅ Booked on ShipGlobal' : '✅ Shipment Booked', `
    <div style="text-align:center;padding:6px 0 2px">
      <div style="font-size:42px">📦</div>
      <div style="font-size:12px;color:var(--gray);margin-top:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:700">Tracking / AWB</div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;color:#15803d;margin-top:4px">${esc(tracking || '—')}</div>
    </div>
    ${_sgLastLabel
      ? `<button class="btn-primary" onclick="openSgLabel(_sgLastLabel)" style="width:100%;margin-top:14px">🏷️ View / Print Label</button>`
      : `<div style="font-size:12px;color:var(--gray);text-align:center;margin-top:12px">Label not ready yet — use 🏷️ Download Label after some time.</div>`}
  `, () => { closeModal(); showBookShipmentDetail(id); });
  const sb = document.getElementById('modal-save'); if (sb) sb.textContent = 'Done';
}

function openSgLabel(b64) {
  try {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast('Could not open label', 'error'); }
}

async function downloadSgLabel(tracking) {
  toast('Fetching label…', 'info');
  const r = await api('POST', '/api/shipglobal/order', { tracking });
  if (!r?.success) { toast(r?.error || 'Label not available yet', 'error'); return; }
  if (r.data?.label) openSgLabel(r.data.label);
  else toast('Label not ready yet', 'error');
}

let _lvLead = null;
async function openLocalVendorModal(id) {
  const r = await api('GET', `/api/shipment-leads/${id}`);
  if (!r?.success) { toast('Lead not found', 'error'); return; }
  _lvLead = r.data;
  const l = _lvLead;
  showModal('📞 ' + (l.localVendor ? (isAdmin() ? 'Edit Local Vendor Booking' : 'Edit Local Booking') : (isAdmin() ? 'Book with Local Vendor' : 'Book with Local Partner')), `
    <div class="fg"><label>${isAdmin() ? 'Vendor Name' : 'Partner Name'} *</label><input id="lv-name" placeholder="${l.localVendor && !isAdmin() ? '•••••• (saved)' : 'e.g. Transport partner'}" value="${isAdmin() ? esc(l.localVendor || '') : ''}"/></div>
    <div class="fg" style="margin-top:10px"><label>${isAdmin() ? 'Rate (₹)' : 'Agreed Rate (₹)'} *</label><input id="lv-rate" type="number" min="1" step="any" placeholder="e.g. 2500" value="${l.localVendorRate || ''}"/></div>
    <div style="font-size:11.5px;color:var(--gray);margin-top:10px">Booking is placed with this partner by call/WhatsApp — only the name and agreed rate are saved here.</div>

  `, async () => {

    const name = (l.localVendor && !isAdmin()) ? l.localVendor : inputName;

    if (!rate || rate <= 0) { toast('Enter agreed rate', 'error'); return; }

      localVendor: name,

async function removeLocalBooking() {
  if (!_lvLead) return;
  const rr = await api('PATCH', `/api/shipment-leads/${_lvLead.id}`, { localVendor: null, localVendorRate: null, localVendorBookedAt: null });
  if (!rr?.success) { toast(rr?.error || 'Error removing booking', 'error'); return; }
  closeModal();
  toast('Local vendor booking removed', 'success');
  showBookShipmentDetail(_lvLead.id);
}

async function getBookRates(id) {
  const r = await api('GET', `/api/shipment-leads/${id}`);
  if (!r?.success) { toast('Lead not found', 'error'); return; }
  const l = r.data;

  if (l.shipmentType === 'international') {
    const pc = extractIntlPostcode(l.destination);
    const c = guessCountry(l.destination);
    const w = parseFloat(l.weight);
    const ready = w > 0 && pc && c && c !== 'IN';
    if (ready) {
      toast('Getting Rates', 'info');
      showShipGlobalBookingRates(l, { w, pc, c, auto: true });
    } else {
      showShipGlobalBookingRates(l, { w: w > 0 ? w : '', pc: pc || '', c: c || '' });
    }
    return;
  }

  const missing = [];
  if (!l.origin) missing.push('origin address');
  if (!l.destination) missing.push('destination address');
  if (!l.weight) missing.push('weight');
  if (!l.declaredValue) missing.push('declared value');
  if (missing.length) {
    toast(`Please fill ${missing.join(', ')} first`, 'error');
    return;
  }

  const extractPin = (s) => { const m = (s||'').match(/\b(\d{6})\b/); return m ? m[1] : null; };
  const sourcePin = extractPin(l.origin);
  const destPin = extractPin(l.destination);

  if (!sourcePin) {
    toast('Could not find 6-digit pincode in origin address. Please add pincode (e.g. Ahmedabad, Gujarat 380054).', 'error');
    return;
  }
  if (!destPin) {
    toast('Could not find 6-digit pincode in destination address. Please add pincode (e.g. Mumbai, Maharashtra 400001).', 'error');
    return;
  }

  const weightG = Math.round(l.weight * 1000);

  // Build dimensions from packing list (each row = 1 box)
  const packing = Array.isArray(l.packingList) ? l.packingList : [];
  let dimensions = [];
  if (packing.length > 0) {
    packing.forEach(p => {
      const pL = parseFloat(p.length) || 50;
      const pW = parseFloat(p.width) || 40;
      const pH = parseFloat(p.height) || 30;
      dimensions.push({ length_cm: pL, width_cm: pW, height_cm: pH, box_count: 1 });
    });
  }
  // Fallback to lead-level dimensions if no packing list
  if (dimensions.length === 0) {
    const parseDimArr = (s) => { if(!s) return [50,40,30]; const p=s.split('x').map(Number); return [p[0]||50,p[1]||40,p[2]||30]; };
    const [dL,dW,dH] = parseDimArr(l.dimensions);
    dimensions = [{ length_cm: dL, width_cm: dW, height_cm: dH, box_count: 1 }];
  }

  toast('Getting Rates', 'info');
  const rateR = await api('POST', '/api/delhivery/rate', {
    source_pin: sourcePin,
    consignee_pin: destPin,
    weight_g: weightG,
    inv_amount: l.declaredValue,
    dimensions: dimensions,
    payment_mode: 'prepaid',
  });

  if (!rateR) {
    toast('Session expired. Please log in again.', 'error');
    return;
  }
  if (!rateR.success) {
    toast(rateR.error || 'Failed to get rates', 'error');
    return;
  }

  const rateData = rateR.data;
  await api('PATCH', `/api/shipment-leads/${id}`, { delhiveryRate: rateData.finalRate, chargedWeight: rateData.chargedWeight });

  const services = dhServicesFrom(rateData);
  const firstAvail = services.find(s => s.available !== false && Number(s.finalRate) > 0);

  // Calculate volumetric weight breakdown from packing list
  let volWeightRows = '';
  let totalVolWt = 0;
  if (packing.length > 0) {
    packing.forEach((p, i) => {
      const len = parseFloat(p.length) || 0;
      const wid = parseFloat(p.width) || 0;
      const hgt = parseFloat(p.height) || 0;
      const unit = (p.unit || 'cm').toLowerCase();
      const divisor = unit === 'in' ? 139 : 4500;
      const volWt = (len * wid * hgt) / divisor;
      totalVolWt += volWt;
      volWeightRows += `<tr><td style="padding:6px 12px;font-size:12px;color:var(--gray);border-bottom:1px solid var(--gray3)">${i+1}. ${len}×${wid}×${hgt}${unit}</td><td style="padding:6px 12px;font-size:12px;text-align:right;border-bottom:1px solid var(--gray3)">${volWt.toFixed(2)} kg</td></tr>`;
    });
  }

  showModal('Rate Card', `
    <div style="background:var(--white);border-radius:10px;overflow:hidden;border:1px solid var(--gray3)">
      <!-- Services: Domestic (B2C) + B2B Surface, both with YNC pricing -->
      <div style="padding:14px 16px">
        ${services.map(s => {
          const avail = s.available !== false && Number(s.finalRate) > 0;
          const bk = dhBreakupList(s.priceBreakup);
          const cw = s.chargedWeight != null && s.chargedWeight !== '' ? `${Number(s.chargedWeight)} kg` : '—';
          return `
        <div style="border:1.5px solid ${avail ? 'var(--brand-border)' : 'var(--gray3)'};background:${avail ? 'var(--brand-bg)' : 'var(--gray4)'};border-radius:10px;padding:12px 14px;margin-bottom:10px;${avail ? '' : 'opacity:.7'}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
            <div>
              <div style="font-size:13.5px;font-weight:700;color:var(--black)">${esc(s.title)}${s.note ? ` <span style="font-size:10.5px;color:var(--gray2);font-weight:600">· ${esc(s.note)}</span>` : ''}</div>
              <div style="font-size:11.5px;color:var(--gray);margin-top:2px">⚖️ Chargeable ${cw}${s.zone ? ' · Zone ' + esc(s.zone) : ''}</div>
              ${isAdmin() ? `<div style="font-size:11px;color:var(--gray2);margin-top:2px">Vendor: ₹${Number(s.vendorPrice || 0).toLocaleString('en-IN')}${avail ? '' : ' · rate card not active'}</div>` : ''}
              ${isAdmin() && bk.length ? `
              <details style="margin-top:6px">
                <summary style="font-size:11px;color:var(--gray);cursor:pointer">🧾 Price Break Down</summary>
                <div style="padding-top:4px">
                  ${bk.map(item => `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11.5px;border-bottom:1px solid var(--gray3)"><span style="color:var(--gray)">${item.label}</span><span style="color:var(--black);font-weight:500">₹${item.amount.toLocaleString()}</span></div>`).join('')}
                  <div style="display:flex;justify-content:space-between;padding:5px 0 2px;font-size:12.5px;font-weight:700;border-top:1px solid var(--gray3);margin-top:3px"><span>Vendor Total</span><span>₹${Number(s.vendorPrice || 0).toLocaleString()}</span></div>
                </div>
              </details>` : ''}
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--brand);text-transform:uppercase">YNC Rate</div>
              <div style="font-size:22px;font-weight:800;color:var(--brand-dark)">${avail ? '₹' + Number(s.finalRate).toLocaleString('en-IN') : '—'}</div>
              ${avail ? '' : `<div style="font-size:10.5px;color:var(--gray2)">${isAdmin() ? 'Rate card inactive' : 'Not available'}</div>`}
            </div>
          </div>
        </div>`;
        }).join('')}
        ${firstAvail ? `<div style="font-size:11px;color:var(--gray2);text-align:center;margin-top:2px">Booking uses the B2B Surface rate shown above.</div>` : ''}
      </div>
    </div>
    <!-- Weights -->
    <div style="margin-top:10px;font-size:12px;color:var(--gray2);display:flex;gap:16px;flex-wrap:wrap">
      <span>Physical: <strong style="color:var(--black)">${l.weight || '—'} kg</strong></span>
      <span>Chargeable: <strong style="color:var(--black)">${rateData.chargedWeight ? rateData.chargedWeight+'kg' : '—'}</strong></span>
      ${totalVolWt > 0 ? `<span>Volumetric: <strong style="color:var(--black)">${totalVolWt.toFixed(2)} kg</strong></span>` : ''}
    </div>
    ${volWeightRows ? `
    <div style="margin-top:10px;background:var(--gray4);border-radius:8px;padding:8px 0">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="border-bottom:1px solid var(--gray3)">
          <th style="padding:6px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);text-align:left">Dimensions</th>
          <th style="padding:6px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);text-align:right">Vol. Weight</th>
        </tr></thead>
        <tbody>${volWeightRows}</tbody>
        <tfoot><tr style="font-weight:700;border-top:1px solid var(--gray3)">
          <td style="padding:6px 12px;font-size:11px;text-align:right">Total Volumetric</td>
          <td style="padding:6px 12px;font-size:11px;text-align:right">${totalVolWt.toFixed(2)} kg</td>
        </tr></tfoot>
      </table>
    </div>` : ''}
  `, () => { closeModal(); });
}

function confirmBookShipment(id) {
  showModal('Confirm Booking', `
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:40px;margin-bottom:12px">🚚</div>
      <div style="font-size:16px;font-weight:700;color:var(--black);margin-bottom:6px">Are you sure you want to book a shipment?</div>
      <div style="font-size:13px;color:var(--gray)">This will create a manifest and generate an LR/AWB number.</div>
    </div>
  `, async () => {
    closeModal();
    await executeBookShipment(id);
  });
}

async function executeBookShipment(id) {
  const r = await api('GET', `/api/shipment-leads/${id}`);
  if (!r?.success) { toast('Lead not found', 'error'); return; }
  const l = r.data;

  if (!l.origin || !l.destination || !l.weight || !l.declaredValue) {
    toast('Please fill origin, destination, weight, and declared value', 'error');
    return;
  }

  const extractPin = (s) => { const m = (s||'').match(/\b(\d{6})\b/); return m ? m[1] : null; };
  const sourcePin = extractPin(l.origin);
  const destPin = extractPin(l.destination);

  if (!sourcePin || !destPin) {
    toast('Could not extract 6-digit pincode from origin/destination', 'error');
    return;
  }

  const dAddr = _parseAddress(l.destination);

  // Build dimensions from packing list (each row = 1 box)
  const packing = Array.isArray(l.packingList) ? l.packingList : [];
  let manifestDimensions = [];
  let totalQty = 0;
  if (packing.length > 0) {
    packing.forEach(p => {
      const pL = parseFloat(p.length) || 50;
      const pW = parseFloat(p.width) || 40;
      const pH = parseFloat(p.height) || 30;
      const q = parseInt(p.qty) || 1;
      totalQty += q;
      manifestDimensions.push({ length_cm: pL, width_cm: pW, height_cm: pH, box_count: 1 });
    });
  }
  if (manifestDimensions.length === 0) {
    const parseDimArr = (s) => { if(!s) return [50,40,30]; const p=s.split('x').map(Number); return [p[0]||50,p[1]||40,p[2]||30]; };
    const [dL,dW,dH] = parseDimArr(l.dimensions);
    manifestDimensions = [{ length_cm: dL, width_cm: dW, height_cm: dH, box_count: 1 }];
    totalQty = l.numberOfPackages || 1;
  }

  // Build shipment_details from packing list
  let shipmentDetails = [];
  if (packing.length > 0) {
    packing.forEach(p => {
      shipmentDetails.push({
        desc: p.description || 'General goods',
        qty: parseInt(p.qty) || 1,
        value: parseFloat(p.total) || 0,
      });
    });
  } else {
    shipmentDetails = [{ desc: l.cargoType || 'General goods', qty: totalQty, value: l.declaredValue }];
  }

  const cleanPhone = (p) => { if(!p) return ''; const d = p.replace(/\D/g,''); if(d.length===10) return d; if(d.length===12 && d.startsWith('91')) return d.slice(2); if(d.length===13 && d.startsWith('091')) return d.slice(3); return d.slice(-10); };

  toast('Creating manifest...', 'info');

  const manifestR = await api('POST', '/api/delhivery/manifest', {
    payment_mode: 'prepaid',
    weight: Math.round(l.weight * 1000),
    dropoff_location: {
      consignee_name: l.receiverName || l.customerName || '',
      address: l.destAddress1 || l.address1 || '',
      address_1: l.destAddress2 || l.address2 || '',
      address_2: l.destAddress3 || l.address3 || '',
      city: dAddr.city,
      state: dAddr.state,
      pin: destPin,
      phone: cleanPhone(l.receiverPhone || l.phone || ''),
    },
    shipment_details: shipmentDetails,
    dimensions: manifestDimensions,
    inv_amount: l.declaredValue,
    rov_insurance: false,
    freight_mode: 'fop',
    fm_pickup: true,
  });

  if (!manifestR) { toast('Session expired. Please log in again.', 'error'); return; }
  if (!manifestR.success) { toast(manifestR.error || 'Failed to create manifest', 'error'); return; }

  const jobId = manifestR.data?.job_id;
  if (!jobId) { toast('No job_id received', 'error'); return; }

  await api('PATCH', `/api/shipment-leads/${id}`, { delhiveryJobId: jobId });
  _invalidateBookCache();
  toast('Manifest created. Polling for LR/AWB...', 'info');

  let lr = null, awb = null;
  for (let i = 0; i < 15; i++) {
    await new Promise(resolve => setTimeout(resolve, 3000));
    const statusR = await api('GET', `/api/delhivery/status?job_id=${jobId}`);
    if (statusR?.success) {
      const entries = statusR.data?.entries || statusR.data?.manifest_entry || [];
      if (Array.isArray(entries)) {
        for (const e of entries) {
          if (e.lr_no || e.lrn) { lr = e.lr_no || e.lrn; awb = e.awb || e.tracking_id; break; }
        }
      }
      if (lr) break;
      if (statusR.data?.lr_no || statusR.data?.lrn) { lr = statusR.data.lr_no || statusR.data.lrn; awb = statusR.data.awb || statusR.data.tracking_id; break; }
    }
  }

  if (lr) {
    await api('PATCH', `/api/shipment-leads/${id}`, {
      delhiveryLr: lr, delhiveryAwb: awb, status: 'shipment_booked',
    });
    _invalidateBookCache();
    toast(`Shipment booked! LR: ${lr}`, 'success');
    showBookShipmentDetail(id);
  } else {
    toast('Manifest submitted but LR/AWB not yet available. Check back in a few minutes.', 'info');
    showBookShipmentDetail(id);
  }
}

async function downloadLabel(lrn) {
  if (!lrn) { toast('No LR number available', 'error'); return; }
  toast('Generating label...', 'info');
  const r = await api('GET', `/api/delhivery/label?lrn=${encodeURIComponent(lrn)}&size=a4`);
  if (!r?.success) { toast(r?.error || 'Failed to get label', 'error'); return; }

  const urls = r.data?.urls || r.data;
  let labelHtml = '';
  if (Array.isArray(urls)) {
    for (const url of urls) {
      if (url.base64) {
        labelHtml += `<div style="text-align:center;margin:10px 0"><img src="data:image/png;base64,${url.base64}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
      } else if (url.url) {
        labelHtml += `<div style="text-align:center;margin:10px 0"><img src="${url.url}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
      }
    }
  } else if (urls?.base64) {
    labelHtml = `<div style="text-align:center"><img src="data:image/png;base64,${urls.base64}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
  } else if (urls?.url) {
    labelHtml = `<div style="text-align:center"><img src="${urls.url}" style="max-width:100%;border:1px solid var(--gray3);border-radius:8px"/></div>`;
  }

  if (!labelHtml) { toast('No label data received', 'error'); return; }

  showModal(`Label — ${lrn}`, `
    <div style="max-height:70vh;overflow-y:auto">${labelHtml}</div>
  `, () => { closeModal(); });
}

async function deleteBookShipment(id) {
  if (!confirm('Delete this booking?')) return;
  const r = await api('DELETE', `/api/shipment-leads/${id}`);
  if (r?.success) { toast('Deleted', 'success'); _invalidateBookCache(); renderBookShipment(); }
  else toast(r?.error || 'Error', 'error');
}
