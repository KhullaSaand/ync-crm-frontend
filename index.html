<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>YNC CRM</title>
<style>
:root{
  --brand:#8B0000;
  --brand-dark:#5a0000;
  --brand-light:#b30000;
  --brand-bg:#fff5f5;
  --brand-border:#f5cccc;
  --black:#111;
  --gray:#64748b;
  --gray2:#94a3b8;
  --gray3:#e2e8f0;
  --gray4:#f8fafc;
  --white:#fff;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --orange:#ea580c;
  --orange-bg:#fff7ed;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --yellow:#ca8a04;
  --yellow-bg:#fefce8;
  --purple:#7c3aed;
  --purple-bg:#f3e8ff;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:var(--black);min-height:100vh}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none}
a{text-decoration:none;color:inherit}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#5a0000 0%,#8B0000 50%,#b30000 100%)}
.auth-card{background:var(--white);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .logo-ync{font-size:42px;font-weight:900;color:var(--brand);letter-spacing:-2px;line-height:1}
.auth-logo .logo-sub{font-size:11px;letter-spacing:4px;color:var(--gray);text-transform:uppercase;margin-top:4px}
.auth-logo .logo-tagline{font-size:13px;color:var(--gray);margin-top:8px}
.auth-tabs{display:flex;border-bottom:2px solid var(--gray3);margin-bottom:24px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.auth-tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1.5px solid var(--gray3);border-radius:var(--radius);font-size:14px;transition:border .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--brand)}
.btn-primary{width:100%;padding:12px;background:var(--brand);color:var(--white);border-radius:var(--radius);font-size:15px;font-weight:700;transition:background .2s;margin-top:4px}
.btn-primary:hover{background:var(--brand-dark)}
.auth-error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.auth-error.show{display:block}

/* LAYOUT */
#app{display:none;height:100vh;overflow:hidden;flex-direction:row}
#app.show{display:flex}
#sidebar{width:240px;min-width:240px;background:var(--brand-dark);display:flex;flex-direction:column;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--white);border-bottom:1px solid var(--gray3);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px}

/* SIDEBAR */
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo .s-ync{font-size:28px;font-weight:900;color:#fff;letter-spacing:-1px}
.sidebar-logo .s-crm{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.6);text-transform:uppercase;margin-top:2px}
.sidebar-logo .s-tag{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}
.sidebar-nav{padding:12px 8px;flex:1}
.nav-section{margin-bottom:6px}
.nav-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.75);font-size:13.5px;font-weight:500;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item .ni{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--brand-light);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.su-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.su-name{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.su-role{font-size:11px;color:rgba(255,255,255,.5)}
.su-logout{margin-left:auto;background:none;color:rgba(255,255,255,.5);font-size:18px;padding:4px;border-radius:6px;transition:color .2s}
.su-logout:hover{color:#fff}

/* TOPBAR */
.topbar-title{font-size:18px;font-weight:700;color:var(--black)}
.topbar-right{display:flex;align-items:center;gap:12px}
.btn-add{background:var(--brand);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-add:hover{background:var(--brand-dark)}
.search-box{position:relative}
.search-box input{padding:8px 12px 8px 34px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;width:220px;transition:border .2s}
.search-box input:focus{border-color:var(--brand)}
.search-box .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray2);font-size:15px}

/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--brand)}
.stat-card.green{border-left-color:var(--green)}
.stat-card.blue{border-left-color:var(--blue)}
.stat-card.orange{border-left-color:var(--orange)}
.stat-card.purple{border-left-color:var(--purple)}
.stat-label{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:28px;font-weight:500;color:var(--black);margin-top:6px;line-height:1}
.stat-sub{font-size:12px;color:var(--gray2);margin-top:4px}

/* TABLE */
.table-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-header{padding:16px 20px;border-bottom:1px solid var(--gray3);display:flex;align-items:center;justify-content:space-between}
.table-title{font-size:15px;font-weight:700}
.table-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-select{padding:6px 10px;border:1.5px solid var(--gray3);border-radius:7px;font-size:13px;color:var(--black);background:var(--white)}
.filter-select:focus{border-color:var(--brand);outline:none}
table{width:100%;border-collapse:collapse}
thead th{background:var(--gray4);padding:10px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray3)}
tbody tr{border-bottom:1px solid var(--gray3);transition:background .1s;cursor:pointer}
tbody tr:hover{background:var(--brand-bg)}
tbody tr:last-child{border-bottom:none}
td{padding:12px 16px;font-size:13.5px;vertical-align:middle}
.avatar-cell{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-bg);border:1.5px solid var(--brand-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0}
.av.sm{width:26px;height:26px;font-size:10px}
.cell-name{font-weight:600;color:var(--black)}
.cell-sub{font-size:12px;color:var(--gray2);margin-top:1px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge-prospect{background:#f1f5f9;color:#475569}
.badge-qualified{background:var(--blue-bg);color:var(--blue)}
.badge-hot_lead{background:#fff7ed;color:#c2410c}
.badge-negotiation{background:var(--yellow-bg);color:var(--yellow)}
.badge-won{background:var(--green-bg);color:var(--green)}
.badge-lost{background:#fee2e2;color:#dc2626}
.badge-cold{background:#f1f5f9;color:#94a3b8}
/* lead statuses (unified) */
.badge-new_inquiry{background:var(--blue-bg);color:var(--blue)}
.badge-quoted{background:var(--yellow-bg);color:var(--yellow)}
.badge-follow_up{background:#fff7ed;color:#c2410c}
.badge-shipment_booked{background:var(--green-bg);color:var(--green)}
.badge-cancelled{background:#fee2e2;color:#dc2626}
/* task */
.badge-pending{background:var(--yellow-bg);color:var(--yellow)}
.badge-in_progress{background:var(--blue-bg);color:var(--blue)}
.badge-completed{background:var(--green-bg);color:var(--green)}
.badge-overdue{background:#fee2e2;color:#dc2626}
/* priority */
.badge-high{background:#fee2e2;color:#dc2626}
.badge-medium{background:var(--yellow-bg);color:var(--yellow)}
.badge-low{background:var(--green-bg);color:var(--green)}
/* shipment mode */
.badge-air{background:var(--blue-bg);color:var(--blue)}
.badge-sea{background:var(--purple-bg);color:var(--purple)}
.badge-road{background:var(--green-bg);color:var(--green)}
.badge-courier{background:#fff7ed;color:#c2410c}
/* category badges */
.badge-logistics{background:var(--blue-bg);color:var(--blue)}
.badge-ecommerce{background:var(--purple-bg);color:var(--purple)}
.badge-customs{background:var(--orange-bg);color:var(--orange)}
.badge-moving{background:var(--green-bg);color:var(--green)}
.badge-warehousing{background:var(--yellow-bg);color:var(--yellow)}
/* sub-nav category filters */
.cat-filters{padding:2px 0 6px 0}
.cat-filter{display:block;padding:5px 12px 5px 42px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border-radius:6px;transition:all .15s;margin-bottom:1px}
.cat-filter:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.cat-filter.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:720px}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--gray3);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:17px;font-weight:700}
.modal-close{background:none;font-size:22px;color:var(--gray);padding:4px;border-radius:6px;line-height:1}
.modal-close:hover{color:var(--black)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--gray3);display:flex;justify-content:flex-end;gap:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--gray);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13.5px;transition:border .2s;color:var(--black);background:var(--white)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand)}
.fg textarea{resize:vertical;min-height:70px}
.btn-cancel{padding:9px 20px;border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;color:var(--gray);background:var(--white)}
.btn-cancel:hover{background:var(--gray4)}
.btn-save{padding:9px 24px;background:var(--brand);color:#fff;border-radius:8px;font-size:13px;font-weight:700}
.btn-save:hover{background:var(--brand-dark)}
.btn-danger{padding:9px 20px;background:#dc2626;color:#fff;border-radius:8px;font-size:13px;font-weight:700}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--gray2)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--gray);margin-bottom:6px}
.empty-sub{font-size:13px}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--gray3);font-size:13px;color:var(--gray)}
.page-btns{display:flex;gap:6px}
.page-btn{padding:6px 12px;border:1.5px solid var(--gray3);border-radius:7px;font-size:13px;background:var(--white);color:var(--gray);font-weight:600}
.page-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.page-btn:disabled{opacity:.4;cursor:default}
.page-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* DETAIL PANEL */
.detail-panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
.dp-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.dp-name{font-size:20px;font-weight:800}
.dp-company{font-size:14px;color:var(--gray);margin-top:3px}
.dp-actions{display:flex;gap:8px}
.btn-edit{padding:7px 16px;background:var(--brand-bg);color:var(--brand);border:1.5px solid var(--brand-border);border-radius:8px;font-size:13px;font-weight:600}
.btn-edit:hover{background:var(--brand);color:#fff}
.btn-back{padding:7px 14px;background:var(--gray4);border:1.5px solid var(--gray3);border-radius:8px;font-size:13px;font-weight:600;color:var(--gray);display:flex;align-items:center;gap:6px}
.btn-back:hover{background:var(--gray3)}
.dp-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dp-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray2);margin-bottom:3px;display:block}
.dp-field span{font-size:14px;color:var(--black);font-weight:500}
.section-title{font-size:14px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--gray3)}

/* DASHBOARD QUICK */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.quick-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.quick-card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray3)}
.activity-item:last-child{border:none}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:5px}
.act-title{font-size:13px;font-weight:500}
.act-time{font-size:11px;color:var(--gray2)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slideIn .3s ease}
.toast-item.success::before{content:'✅'}
.toast-item.error::before{content:'❌'}
.toast-item.info::before{content:'ℹ️'}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ROLE BADGE */
.role-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.role-admin{background:#fee2e2;color:#991b1b}
.role-manager{background:var(--blue-bg);color:#1d4ed8}
.role-sales_rep{background:var(--green-bg);color:#15803d}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--gray2);font-size:14px}
.spinner{width:28px;height:28px;border:3px solid var(--gray3);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TABS */
.tab-strip{display:flex;gap:4px;background:var(--gray4);padding:4px;border-radius:10px;margin-bottom:20px;width:fit-content}
.tab-btn{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--gray);background:none;transition:all .15s}
.tab-btn.active{background:var(--white);color:var(--brand);box-shadow:var(--shadow)}

/* TRACKING TIMELINE */
.tracking-tl{position:relative;padding-left:28px;margin:0 0 20px 0}
.tracking-tl::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--gray3)}
.tracking-tl-item{position:relative;padding:10px 0 10px 0;cursor:default}
.tracking-tl-item::before{content:'';position:absolute;left:-22px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--gray3);border:2px solid var(--white);z-index:1}
.tracking-tl-item:last-child::before{background:var(--brand)}
.tracking-tl-item .tl-status{font-size:14px;font-weight:600;color:var(--black)}
.tracking-tl-item .tl-loc{font-size:12px;color:var(--gray);margin-top:2px}
.tracking-tl-item .tl-date{font-size:11px;color:var(--gray2);margin-top:2px}
.tracking-tl-item .tl-del{position:absolute;right:0;top:10px;background:none;color:var(--gray2);font-size:16px;padding:2px 6px;border-radius:4px}
.tracking-tl-item .tl-del:hover{color:#dc2626;background:#fee2e2}
.btn-tracking{padding:7px 16px;background:#059669;color:#fff;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-tracking:hover{background:#047857}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-ync">YNC</div>
      <div class="logo-crm">CRM</div>
      <div class="logo-tagline">Your Next Courier — CRM</div>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">Sign In</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">Register</div>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div id="tab-login">
      <div class="form-group"><label>Email</label><input id="login-email" type="email" placeholder="admin@ync.in"/></div>
      <div class="form-group"><label>Password</label><input id="login-password" type="password" placeholder="Password"/></div>
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
    </div>
    <div id="tab-register" style="display:none">
      <div class="form-group"><label>Full Name</label><input id="reg-name" type="text" placeholder="Your name"/></div>
      <div class="form-group"><label>Email</label><input id="reg-email" type="email" placeholder="you@company.com"/></div>
      <div class="form-group"><label>Password</label><input id="reg-password" type="password" placeholder="Min 8 characters"/></div>
      <div class="form-group"><label>Company Name</label><input id="reg-company" type="text" placeholder="Your company (optional)"/></div>
      <button class="btn-primary" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo">
      <div class="s-ync">YNC</div>
      <div class="s-crm">CRM</div>
      <div class="s-tag">Your Next Courier</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard"><span class="ni">📊</span>Dashboard</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Leads</div>
        <div class="nav-item" onclick="nav('quote-leads')" id="nav-quote-leads"><span class="ni">💬</span>Leads</div>
        <div class="cat-filters" id="cat-filters" style="display:none">
          <div class="cat-filter active" data-cat="" onclick="setCategoryFilter('')">All</div>
          <div class="cat-filter" data-cat="logistics" onclick="setCategoryFilter('logistics')">Logistics</div>
          <div class="cat-filter" data-cat="ecommerce" onclick="setCategoryFilter('ecommerce')">eCommerce</div>
          <div class="cat-filter" data-cat="customs" onclick="setCategoryFilter('customs')">Customs</div>
          <div class="cat-filter" data-cat="moving" onclick="setCategoryFilter('moving')">Moving</div>
          <div class="cat-filter" data-cat="warehousing" onclick="setCategoryFilter('warehousing')">Warehousing</div>
        </div>
        <div class="nav-item" onclick="nav('shipment-leads')" id="nav-shipment-leads"><span class="ni">🚢</span>Shipment</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const API = 'https://ync-crm-backend.vercel.app';

// ─── STATE ─────────────────────────────────────────────────────────────────
let token    = localStorage.getItem('ync_token') || '';
let me       = JSON.parse(localStorage.getItem('ync_me') || 'null');
let curPage  = 'dashboard';
let curData  = {};
let modalCb  = null;
let searchTimer = null;
let curSearch = '';
let curFilter = {};
let curPageNum = 1;
let curCategoryFilter = '';

// ─── API CACHE ──────────────────────────────────────────────────────────────
const _apiCache = new Map();
const CACHE_TTL = 60000; // 60s auto-refresh

function cacheKey(method, path) { return `${method}:${path}`; }

function invalidateCache(pathPrefix) {
  for (const k of _apiCache.keys()) {
    if (k.split(':')[1]?.startsWith(pathPrefix)) _apiCache.delete(k);
  }
}

// ─── API HELPER ────────────────────────────────────────────────────────────
async function api(method, path, body) {
  if (method === 'GET' && !body) {
    const ck = cacheKey(method, path);
    const cached = _apiCache.get(ck);
    if (cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
    if (cached) _apiCache.delete(ck); // expired
  }
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const j = await r.json();
  if (!j.success && r.status === 401) { doLogout(); return null; }
  if (method === 'GET' && j.success) _apiCache.set(cacheKey(method, path), { data: j, ts: Date.now() });
  if (method !== 'GET' && j.success) { invalidateCache(path.split('?')[0].replace(/\/[^/]*$/, '')); }
  return j;
}

let _refreshTimer = null;
let _viewingDetail = false;
function startAutoRefresh() {
  if (_refreshTimer) clearInterval(_refreshTimer);
  _refreshTimer = setInterval(() => {
    if (!token || !curPage || _viewingDetail) return;
    const modalOpen = document.getElementById('modal-overlay')?.classList.contains('show');
    if (modalOpen) return;
    const pageMap = {
      'dashboard':     ['/api/reports?type=summary', '/api/reports?type=activity&range=month'],
      'contacts':      ['/api/contacts?page=1&limit=15'],
      'quote-leads':   ['/api/quote-leads?page=1&limit=15'],
      'shipment-leads':['/api/shipment-leads?page=1&limit=15'],
      'tasks':         ['/api/tasks?page=1&limit=15'],
    };
    const urls = pageMap[curPage];
    if (urls) {
      urls.forEach(u => _apiCache.delete(cacheKey('GET', u)));
      renderPage(curPage);
    }
  }, 15000);
}

function preloadAll() {
  const pages = [
    '/api/reports?type=summary',
    '/api/reports?type=activity&range=month',
    '/api/contacts?page=1&limit=15',
    '/api/quote-leads?page=1&limit=15',
    '/api/shipment-leads?page=1&limit=15',
    '/api/tasks?page=1&limit=15',
  ];
  if (me.role === 'admin' || me.role === 'manager') pages.push('/api/users?page=1&limit=50');
  pages.forEach(p => api('GET', p));
}

// ─── AUTH ──────────────────────────────────────────────────────────────────
function switchAuthTab(t) {
  document.querySelectorAll('.auth-tab').forEach((el,i) => el.classList.toggle('active', (t==='login'&&i===0)||(t==='register'&&i===1)));
  document.getElementById('tab-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('tab-register').style.display = t==='register' ? '' : 'none';
  clearAuthErr();
}
function showAuthErr(msg) { const e = document.getElementById('auth-error'); e.textContent = msg; e.classList.add('show'); }
function clearAuthErr()   { const e = document.getElementById('auth-error'); e.classList.remove('show'); }

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  if (!email || !pass) { showAuthErr('Email and password are required'); return; }
  clearAuthErr();
  const r = await fetch(API + '/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pass })
  }).then(x => x.json()).catch(() => null);
  if (!r || !r.success) { showAuthErr(r?.error || 'Login failed'); return; }
  token = r.data.token; me = r.data.user;
  localStorage.setItem('ync_token', token);
  localStorage.setItem('ync_me', JSON.stringify(me));
  initApp();
}

async function doRegister() {
  const name    = document.getElementById('reg-name').value.trim();
  const email   = document.getElementById('reg-email').value.trim();
  const pass    = document.getElementById('reg-password').value;
  const company = document.getElementById('reg-company').value.trim();
  if (!name || !email || !pass) { showAuthErr('Name, email and password are required'); return; }
  clearAuthErr();
  const r = await fetch(API + '/api/auth/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, password: pass, company })
  }).then(x => x.json()).catch(() => null);
  if (!r || !r.success) { showAuthErr(r?.error || 'Registration failed'); return; }
  token = r.data.token; me = r.data.user;
  localStorage.setItem('ync_token', token);
  localStorage.setItem('ync_me', JSON.stringify(me));
  initApp();
}

async function doLogout() {
  if (token) await fetch(API + '/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }).catch(() => {});
  token = ''; me = null;
  _apiCache.clear();
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
  localStorage.removeItem('ync_token'); localStorage.removeItem('ync_me');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('show');
}

// ─── INIT ──────────────────────────────────────────────────────────────────
function initApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('su-avatar').textContent = me.avatar || me.name?.slice(0,2).toUpperCase() || '??';
  document.getElementById('su-name').textContent   = me.name;
  document.getElementById('su-role').textContent   = roleLabel(me.role);
  if (me.role === 'admin' || me.role === 'manager') {
    document.getElementById('nav-section-admin').style.display = '';
  }
  nav(localStorage.getItem('ync_page') || 'dashboard');
  preloadAll();
  startAutoRefresh();
}

window.onload = () => {
  // Check invite token in URL
  const params = new URLSearchParams(location.search);
  const invite = params.get('invite');
  if (invite) {
    switchAuthTab('register');
    document.getElementById('auth-screen').style.display = 'flex';
    window._inviteToken = invite;
    return;
  }
  if (token && me) { initApp(); }
  else { document.getElementById('auth-screen').style.display = 'flex'; }
};

// ─── NAVIGATION ───────────────────────────────────────────────────────────
const PAGE_TITLES = {
  dashboard: 'Dashboard', contacts: 'Contacts',
  'quote-leads': 'Leads', 'shipment-leads': 'Shipment',
  tasks: 'Tasks', users: 'Team Management', reports: 'Reports'
};
const ADD_LABELS = {
  contacts: '+ Contact', 'quote-leads': '+ Quote Lead',
  'shipment-leads': '+ Shipment Lead', tasks: '+ Task', users: '+ Team Member'
};

function nav(page) {
  curPage = page; curSearch = ''; curPageNum = 1; curFilter = {};
  _viewingDetail = false;
  localStorage.setItem('ync_page', page);
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const ni = document.getElementById('nav-' + page);
  if (ni) ni.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  const addBtn = document.getElementById('btn-add');
  const srchWrap = document.getElementById('search-wrap');
  if (ADD_LABELS[page]) { addBtn.style.display = ''; addBtn.textContent = ADD_LABELS[page]; }
  else addBtn.style.display = 'none';
  const searchPages = ['contacts','quote-leads','shipment-leads','tasks','users'];
  srchWrap.style.display = searchPages.includes(page) ? '' : 'none';
  document.getElementById('search-input').value = '';
  const catFilters = document.getElementById('cat-filters');
  if (catFilters) catFilters.style.display = page === 'quote-leads' ? '' : 'none';
  if (page !== 'quote-leads') { curCategoryFilter = ''; }
  renderPage(page);
}

function onSearch(v) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { curSearch = v; curPageNum = 1; renderPage(curPage); }, 350);
}

// ─── RENDER ROUTER ────────────────────────────────────────────────────────
function renderPage(page) {
  switch(page) {
    case 'dashboard':     renderDashboard(); break;
    case 'contacts':      renderContacts(); break;
    case 'quote-leads':   renderQuoteLeads(); break;
    case 'shipment-leads':renderShipmentLeads(); break;
    case 'tasks':         renderTasks(); break;
    case 'users':         renderUsers(); break;
    case 'reports':       renderReports(); break;
  }
}

async function toggleTask(id, done, e) {

  await api('PATCH', `/api/tasks/${id}`, { isDone: done, status: done ? 'completed' : 'pending' });

  renderTasks();
}

function showModal(title, bodyHtml, saveCb) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-overlay').classList.add('show');
  modalCb = saveCb;
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); modalCb = null; }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
function modalSave() { if (modalCb) modalCb(); }

  showModal(c ? 'Edit Contact' : 'New Contact', `
  <div class="form-row"><div class="fg"><label>Full Name *</label><input id="mf-name" value="${esc(c?.name||'')}"/></div>

  <div class="fg"><label>Company</label><input id="mf-company" value="${esc(c?.company||'')}"/></div></div>
  <div class="form-row"><div class="fg"><label>Job Title</label><input id="mf-jobtitle" value="${esc(c?.jobTitle||'')}"/></div>
  <div class="fg"><label>Status</label><select id="mf-status">
    ${['prospect','qualified','hot_lead','negotiation','won','lost','cold'].map(s=>`<option value="${s}" ${(c?.status||'prospect')===s?'selected':''}>${fmtStatus(s)}</option>`).join('')}
  </select></div></div>
  <div class="form-row"><div class="fg"><label>Deal Value (INR)</label><input id="mf-dealvalue" type="number" value="${c?.dealValue||''}"/></div>
  <div class="fg"><label>Website</label><input id="mf-website" value="${esc(c?.website||'')}"/></div></div>
  <div class="fg"><label>Notes</label><textarea id="mf-notes">${esc(c?.notes||'')}</textarea></div>`, async () => {
    const body = {
      name: document.getElementById('mf-name').value, email: document.getElementById('mf-email').value,
      phone: document.getElementById('mf-phone').value, company: document.getElementById('mf-company').value,
      jobTitle: document.getElementById('mf-jobtitle').value, status: document.getElementById('mf-status').value,
      dealValue: document.getElementById('mf-dealvalue').value, website: document.getElementById('mf-website').value,
      notes: document.getElementById('mf-notes').value,
    };
    const r = c ? await api('PATCH', `/api/contacts/${c.id}`, body) : await api('POST', '/api/contacts', body);

    closeModal(); renderContacts();
  });
}

async function deleteContact(id) {
  if (!confirm('Delete this contact?')) return;
  const r = await api('DELETE', `/api/contacts/${id}`);
  if (r?.success) { toast('Contact deleted', 'success'); nav('contacts'); }
  else toast(r?.error || 'Error', 'error');
}

// ─── PINCODE AUTO-FILL ────────────────────────────────────────────────────────
const _pinCache = {};
let _pinTimer = null;
function autoFillLocation(pin, prefix) {
  clearTimeout(_pinTimer);
  pin = pin.trim();
  if (pin.length < 4) return;
  if (_pinCache[pin]) { fillLocFields(prefix, _pinCache[pin]); return; }
  _pinTimer = setTimeout(() => _doFetch(pin, prefix), 700);
}

async function _doFetch(pin, prefix) {
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(pin)}&format=json&limit=5&addressdetails=1`,
      { headers: { 'Accept-Language': 'en' } }
    ).catch(() => null);
    if (!res || !res.ok) return;
    const results = await res.json();
    if (!results?.length) return;

    // Pick best result — prefer one with city
    let best = results[0];
    for (const r of results) {
      if (r.address.city || r.address.town) { best = r; break; }
    }
    const a = best.address;

    // Locality = most specific area (suburb, neighbourhood, village etc)
    const locality = a.suburb || a.neighbourhood || a.quarter ||
                     a.residential || a.hamlet || a.village || '';

    // City = proper city name (never same as locality)
    const rawCity = a.city || a.town || a.municipality ||
                    a.city_district || a.county || '';
    const city = rawCity === locality ? (a.county || a.district || '') : rawCity;

    const state   = a.state || a.state_district || '';
    const country = a.country || '';

    const loc = { locality, city, state, country };
    _pinCache[pin] = loc;
    fillLocFields(prefix, loc);
  } catch(e) {}
}

function fillLocFields(prefix, loc) {
  const map = { locality: loc.locality, city: loc.city, state: loc.state, country: loc.country };
  Object.entries(map).forEach(([key, val]) => {
    const el = document.getElementById(`mf-${prefix}-${key}`);
    if (el && val) { el.value = val; el.style.background = '#f0fdf4'; }
  });
}

// ─── DIMENSIONAL WEIGHT ───────────────────────────────────────────────────────
// Formula: (L × W × H) / 5000  — standard international courier divisor
function calcDimWeight(type) {
  const L = parseFloat(document.getElementById('mf-len')?.value) || 0;
  const W = parseFloat(document.getElementById('mf-wid')?.value) || 0;
  const H = parseFloat(document.getElementById('mf-hgt')?.value) || 0;
  const dw = document.getElementById('mf-dimweight');
  if (!dw) return;
  if (L > 0 && W > 0 && H > 0) {
    dw.value = ((L * W * H) / 5000).toFixed(2);
    dw.style.background = '#fefce8';
  } else {
    dw.value = '';
    dw.style.background = '#f1f5f9';
  }
}

function setFilter(key, val) { curFilter[key] = val; curPageNum = 1; renderPage(curPage); }
function setCategoryFilter(cat) { curCategoryFilter = cat; curPageNum = 1; document.querySelectorAll('.cat-filter').forEach(el => el.classList.toggle('active', el.getAttribute('data-cat') === (cat||''))); renderPage(curPage); }
function goPage(p) { curPageNum = p; renderPage(curPage); }
function pgHtml(pg) {
  if (!pg?.totalPages || pg.totalPages <= 1) return '';
  const btns = [];
  for (let i = 1; i <= pg.totalPages; i++) {
    btns.push(`<button class="page-btn${i===pg.page?' active':''}" onclick="goPage(${i})">${i}</button>`);
  }
  return `<div class="pagination"><div>Showing ${((pg.page-1)*pg.limit)+1}–${Math.min(pg.page*pg.limit,pg.total)} of ${pg.total}</div><div class="page-btns">${btns.join('')}</div></div>`;
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function badge(s) { return `<span class="badge badge-${s}">${fmtStatus(s)}</span>`; }
function fmtStatus(s) {
  const map = {
    prospect:'Prospect', qualified:'Qualified', hot_lead:'Hot Lead', negotiation:'Negotiation', won:'Won', lost:'Lost', cold:'Cold',
    new_inquiry:'New Inquiry', quoted:'Quoted', follow_up:'Follow Up', shipment_booked:'Shipment Booked', cancelled:'Cancelled',
    pending:'Pending', in_progress:'In Progress', completed:'Completed', overdue:'Overdue',
    high:'High', medium:'Medium', low:'Low',
    air:'Air', sea:'Sea', road:'Road', courier:'Courier',
  };
  return map[s] || s?.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) || s;
}
function roleLabel(r) { return {admin:'Admin',manager:'Manager',sales_rep:'Sales Rep'}[r]||r; }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtCur(v) { if (!v && v!==0) return '—'; return '₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function emptyState(icon, title, sub) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div><div class="empty-sub">${sub}</div></div>`;
}
function toast(msg, type='info') {
  const t = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.textContent = msg;
  t.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
// Tracking Management Modal
let _trackId = null;
let _trackTimeline = [];
let _trackLeadId = null;
let _trackLeadType = null;

function openTrackingModal(trackId, timeline, leadId, leadType) {
  _trackId = trackId;
  _trackTimeline = Array.isArray(timeline) ? [...timeline] : [];
  _trackLeadId = leadId;
  _trackLeadType = leadType;
  renderTrackingModal();
}

function renderTrackingModal() {
  const tlHtml = _trackTimeline.length
    ? _trackTimeline.map((s,i) => `
      <div class="tracking-tl-item" style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1">
          <div class="tl-status">${esc(s.status || s.status_text || '')}</div>
          ${s.location ? `<div class="tl-loc">📍 ${esc(s.location)}</div>` : ''}
          <div class="tl-date">${fmtDate(s.timestamp || s.status_date)}</div>
        </div>
        <button class="tl-del" onclick="deleteTrackingEntry('${s.id || i}')" title="Delete">✕</button>
      </div>`).join('')
    : '<div style="text-align:center;padding:20px;color:var(--gray2);font-size:13px">No tracking entries yet. Add one below.</div>';

  document.getElementById('modal-title').textContent = 'Manage Tracking';
  document.getElementById('modal-body').innerHTML = `
    <div class="tracking-tl" style="margin-bottom:20px">${tlHtml}</div>
    <div style="border-top:1px solid var(--gray3);padding-top:16px">
      <div style="font-size:13px;font-weight:700;color:var(--gray);margin-bottom:10px">Add Status Entry</div>
      <div class="fg"><label>Status Text *</label><input id="tl-status-text" placeholder="e.g. Picked Up, In Transit, Out for Delivery, Delivered"/></div>
      <div class="fg"><label>Location</label><input id="tl-location" placeholder="e.g. Mumbai, Delhi Hub"/></div>
      <div class="fg"><label>Date & Time</label><input id="tl-date" type="datetime-local"/></div>
      <button class="btn-save" style="width:100%;margin-top:8px" onclick="addTrackingEntry()">➕ Add Entry</button>
    </div>`;
  document.getElementById('modal-foot').innerHTML = '<button class="btn-cancel" onclick="closeTrackingAndRefresh()">Done</button>';
  document.getElementById('modal-overlay').classList.add('show');
}

function closeTrackingAndRefresh() {
  closeModal();
  if (_trackLeadId && _trackLeadType) {
    invalidateCache('/api/tracking/');
    if (_trackLeadType === 'quote') viewQuoteLead(_trackLeadId);
    else if (_trackLeadType === 'shipment') viewShipmentLead(_trackLeadId);
  }
}

async function addTrackingEntry() {
  const statusText = document.getElementById('tl-status-text')?.value?.trim();
  if (!statusText) { toast('Status text is required', 'error'); return; }
  const location = document.getElementById('tl-location')?.value?.trim() || null;
  const statusDate = document.getElementById('tl-date')?.value || null;

  const r = await api('POST', `/api/tracking/${_trackId}/statuses`, {
    status_text: statusText, location, status_date: statusDate ? new Date(statusDate).toISOString() : undefined,
  });
  if (!r?.success) { toast(r?.error || 'Error adding status', 'error'); return; }

  _trackTimeline.push({ id: r.data.id, status: statusText, location, timestamp: r.data.timestamp });
  toast('Status added!', 'success');
  document.getElementById('tl-status-text').value = '';
  document.getElementById('tl-location').value = '';
  document.getElementById('tl-date').value = '';
  renderTrackingModal();
}

async function deleteTrackingEntry(entryId) {
  if (!confirm('Delete this status entry?')) return;
  const r = await api('DELETE', `/api/tracking/${_trackId}/statuses/${entryId}`);
  if (!r?.success) { toast(r?.error || 'Error deleting', 'error'); return; }
  _trackTimeline = _trackTimeline.filter(s => s.id !== entryId);
  toast('Status deleted', 'success');
  renderTrackingModal();
}
</script>
